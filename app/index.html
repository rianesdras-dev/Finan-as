  const X = UI.ext;
  const hd = `<div class="sh-hd"><h2>Extrato do banco</h2><button class="x" data-act="fechar">✕ fechar</button></div>`;
  if(!window.Extrato) return hd + `<div class="nota warn-n">O leitor de extratos não carregou. Abra o app com internet uma vez e tente de novo.</div>`;
  const avisos = X.avisos.length ? `<div class="nota warn-n" style="margin:10px 0">${X.avisos.map(esc).join('<br>')}</div>` : '';
  if(X.carregando) return hd + `<div class="empty">Lendo o extrato…</div>`;
  if(!X.linhas) return hd + `
    <div class="small mut2" style="margin-bottom:12px">Exporte o extrato no app ou no site do banco e escolha o arquivo. <b>OFX</b> ou <b>CSV</b> funcionam melhor; <b>PDF</b> também dá na maioria dos bancos. Pode escolher a conta e a fatura do cartão juntas.</div>
    <button class="btn pri blk" data-act="ext-arq" style="min-height:52px">Escolher arquivo(s)</button>

  const L = X.linhas, por = k => L.map((l,i)=>[l,i]).filter(([l])=>l.acao===k);

  const nomesMes = [...(X.meses||[])].sort().map(mesNome);
  return hd + `
  ${X.arqs.map((a, ai)=>`<div class="card" style="margin-bottom:8px;padding:12px 14px">
    <div style="display:flex;justify-content:space-between;gap:10px"><b style="font-weight:600">${esc(a.banco || a.nome)}</b><span class="tiny mut">${a.trans.length} transações</span></div>

  <div class="small mut2" style="margin:10px 0">${L.length} novas de ${ddmm(datas[0]||HOJE())} a ${ddmm(datas[datas.length-1]||HOJE())}${X.repetidos?` · ${X.repetidos} já importadas antes ficaram de fora`:''}. Toque num item pra trocar a categoria — o app aprende.</div>
  ${inv>=1?`<div class="nota" style="margin-bottom:10px"><b>${brl(inv,0)}</b> saíram da reserva/investimentos nesse período.</div>`:''}
  ${GRUPOS.map(([k, nome, desc])=>{
    const G = por(k); if(!G.length) return '';
    const fechado = ['plano','ignorar','dup'].includes(k) && !X.grupos[k];
    const tot = G.reduce((s,[l])=>s + Math.abs(l.t.valor), 0);
    return `<div class="card flush" style="margin-bottom:10px">
      <button class="hd limpo" data-act="ext-grupo" data-v="${k}" style="padding:12px 16px ${fechado?'12px':'2px'};margin:0;width:100%">
        <span><span class="lbl">${nome} · ${G.length}</span><span class="tiny mut" style="display:block;text-transform:none;letter-spacing:0">${desc}</span></span>
        <span class="num" style="font-size:16px">${k==='gasto'?brl(totGasto):brl(tot)}${fechado?' ›':''}</span></button>
      ${fechado?'':`<div class="rows">${G.map(([l,i])=>linhaExt(l,i)).join('')}</div>`}

  ${X.antes && X.antes.length ? `<label class="sw"><input type="checkbox" data-act="ext-antes"${X.apagarAntes?' checked':''}> Apagar o “Gastos antes do app” de ${nomesMes.join(', ')} (o extrato já traz esses gastos)</label>` : ''}

    <button class="btn ghost blk" data-act="ext-novo" style="margin-top:4px">Escolher outro arquivo</button></div>`;
}
function aplicarExtrato(){
  const X = UI.ext; if(!X || !X.linhas) return;
  snap();
  const n = {gasto:0, conta:0, fatura:0, parcela:0, entrada:0}, meses = {};
  X.linhas.forEach(l=>{
    const t = l.t, m = t.data.slice(0,7), fonte = fonteDe(l);
    S.vistos[t.id] = 1;
    if(l.acao==='gasto'){
      S.lanc.push({id:uid(), d:t.data, v:Math.round(-t.valor*100)/100, c:l.cat||'outros', f:fonte==='cartao'?'cartao':fonte==='mae'?'mae':'pix',
        t:t.desc, ext:t.id, k:l.chave, a:!!l.c.assinatura});
      n.gasto++; meses[m] = (meses[m]||0) + 1;
    }
    else if(l.acao==='conta'){ (S.pagos[m] = S.pagos[m]||{})[l.item] = t.data; n.conta++; }
    else if(l.acao==='fatura'){ (S.pagos[m] = S.pagos[m]||{}).fatura = t.data; n.fatura++; }
    else if(l.acao==='entrada'){ S.entr.push({id:uid(), d:t.data, v:t.valor, t:t.desc, ext:t.id}); n.entrada++; }
    else if(l.acao==='parcela'){
      const mm = mesDaFatura(t.data);
      S.itens.push({id:uid(), tipo:'cartao', nome:semParcela(t.desc), v:Math.abs(t.valor), n:t.parcela.n, de:ymAdd(mm, -(t.parcela.k-1))});
      n.parcela++;
    }
  });
  // o que a pessoa corrigiu vira regra para os próximos extratos
  Object.assign(S.regras, X.regras);
  if(X.apagarAntes && X.antes && X.antes.length){
    S.lanc = S.lanc.filter(l=>!X.antes.includes(l.id));
  }
  if(S.onboard && X.meses && X.meses.has(S.onboard.mes)) S.onboard = null;

function abrirConf(){ UI.cf = {etapa:'arquivo', avisos:[], dec:{}, i:0}; abrir('conf'); }
async function lerFatura(files){
  const F = UI.cf; F.carregando = true; renderSheet();
  const ano = +HOJE().slice(0,4);
  try{
    const f = files[0], bytes = new Uint8Array(await f.arrayBuffer());
    const pdf = /\.pdf$/i.test(f.name) || (bytes[0]===0x25 && bytes[1]===0x50 && bytes[2]===0x44 && bytes[3]===0x46);
    const r = pdf ? Extrato.lerTexto(await textoDoPDF(bytes), {ano, conta:'cartao'}) : Extrato.ler(Extrato.decodificar(bytes), f.name, {ano});
    prepararFatura(r, f.name);
  }catch(e){ F.avisos.push((e && e.message) || 'Não deu pra ler o arquivo'); }
  F.carregando = false; renderSheet();
}
function prepararFatura(r, nome){
  const F = UI.cf;
  if(!(r.transacoes||[]).length){ F.avisos.push('Não achei cobranças nesse arquivo.' + ((r.avisos||[]).length ? ' (' + r.avisos.join('; ') + ')' : '')); return; }
  if(r.conta==='corrente') F.avisos.push('Esse arquivo parece extrato da conta, não fatura. Se for a conta, use “Importar extrato”.');
  const venc = r.referencia && r.referencia.vencimento;
  const cont = {}; r.transacoes.filter(t=>t.valor<0).forEach(t=>{ const mm = mesDaFatura(t.dataCompra||t.data); cont[mm] = (cont[mm]||0)+1; });
  const moda = Object.entries(cont).sort((a,b)=>b[1]-a[1])[0];
  Object.assign(F, {r, nome, m: venc ? venc.slice(0,7) : moda ? moda[0] : MES(), etapa:'mes'});
}
function rodarConf(){
  const F = UI.cf, m = F.m;
  const esperados = plano(m).cart.map(x=>({id:x.it.id, nome:x.it.nome, v:x.v,
    tipo: x.it.n ? 'parcela' : (x.it.ate && x.it.de===x.it.ate ? 'compra' : 'assinatura'), k: x.it.n ? parcK(x.it,m) : undefined, n: x.it.n || undefined}));
  const lancados = lancFatura(m).map(l=>({id:l.id, d:l.d, v:+l.v, t:l.t || CAT[l.c].n}));
  F.rel = Conferencia.conferir({transacoes:F.r.transacoes, classificar: t=>Extrato.classificar(t, S.regras), chave:Extrato.chave,
    esperados, lancados, totalImpresso: F.r.referencia ? F.r.referencia.total : null});
  // fila: só o que precisa de decisão ou aviso, na ordem que mais importa
  const R = F.rel, fila = [];
  R.duplicadas.forEach(x=>fila.push({tipo:'dup', a:x.a, b:x.b}));
  const duvida = [], certos = [];
  R.naoReconhecidos.forEach(x=>((x.c && x.c.confianca==='palpite') || !CAT[x.c && x.c.cat] ? duvida : certos).push(x));
  duvida.forEach(x=>fila.push({tipo:'rec', t:x.t, c:x.c}));
  if(certos.length) fila.push({tipo:'lote', itens:certos});
  R.valorMudou.forEach(x=>fila.push({tipo:'valor', t:x.t, e:x.esperado, d:x.diferenca}));
  R.assinaturasNovas.forEach(x=>fila.push({tipo:'ass', t:x.t}));
  R.parcelasNovas.forEach(x=>fila.push({tipo:'parc', t:x.t}));
  R.faltando.forEach(x=>fila.push({tipo:'falta', e:x.esperado}));
  R.lancadosFaltando.forEach(x=>fila.push({tipo:'lfalta', l:x.lancado}));
  if(R.diferencaTotal != null && Math.abs(R.diferencaTotal) > 1) fila.push({tipo:'total'});
  Object.assign(F, {fila, i:0, etapa: fila.length ? 'cartas' : 'fim', dec:{}});
}

function aplicarConferencia(){
  const F = UI.cf, R = F.rel, m = F.m, feito = new Set(); snap();
  const marca = t => { S.vistos[t.id] = 1; feito.add(t.id); };
  const gasto = (t, cat, extra) => {
    if(feito.has(t.id)) return; marca(t);
    if(S.lanc.some(l=>l.ext===t.id)) return;
    S.lanc.push(Object.assign({id:uid(), d:t.dataCompra||t.data, v:Math.round(-t.valor*100)/100, c:CAT[cat]?cat:'outros', f:'cartao',
      t:t.desc, ext:t.id, k:Extrato.chave(t.desc)}, extra||{}));
  };
  const contestar = t => { gasto(t, 'outros', {contestar:true}); if(!S.contestar.some(x=>x.tid===t.id)) S.contestar.push({id:uid(), tid:t.id, d:t.data, v:-t.valor, t:t.desc, m, status:'aberta'}); };
  const dec = c => F.dec[chaveDec(c)] || {};
  R.batem.forEach(x=>marca(x.t)); R.pagamentos.forEach(x=>marca(x.t));
  R.lancadosAchados.forEach(x=>{ marca(x.t); const l = S.lanc.find(l=>l.id===x.lancado.id); if(l && !l.ext) l.ext = x.t.id; });
  F.fila.forEach(c=>{
    const d = dec(c);
    if(c.tipo==='valor'){
      const it = S.itens.find(i=>i.id===c.e.id), nv = Math.abs(c.t.valor);
      if(it){ if(d.acao==='so') it.so = Object.assign({}, it.so, {[m]:nv}); else if(d.acao==='plano'){ it.hist = (it.hist||[]).filter(h=>h.de < m); if(it.so) delete it.so[m]; it.hist.push({de:m, v:nv}); } }
      marca(c.t);
    } else if(c.tipo==='ass'){
      if(d.acao==='plano'){ S.itens.push({id:uid(), tipo:'cartao', nome:semParcela(c.t.desc), v:Math.abs(c.t.valor), de:m}); marca(c.t); }
      else gasto(c.t, 'outros');
    } else if(c.tipo==='parc'){
      if(d.acao!=='nao'){ S.itens.push({id:uid(), tipo:'cartao', nome:semParcela(c.t.desc), v:Math.abs(c.t.valor), n:c.t.parcela.n, de:ymAdd(m, -(c.t.parcela.k-1))}); marca(c.t); }
      else gasto(c.t, 'compras');
    } else if(c.tipo==='dup'){
      if(d.acao==='contestar'){ const cl = Extrato.classificar(c.a, S.regras); gasto(c.a, cl.cat); contestar(c.b); }
    } else if(c.tipo==='rec'){
      if(d.acao==='contestar') contestar(c.t); else gasto(c.t, d.cat || (c.c && c.c.cat));
    } else if(c.tipo==='lote'){
      const off = d || {};
      c.itens.forEach(x=>{ if(off[x.t.id]==='contestar') contestar(x.t); else gasto(x.t, x.c.cat); });
    }
  });
  // o que sobrou: duplicadas aceitas, taxas, créditos e compras não decididas
  R.duplicadas.forEach(x=>{ [x.a, x.b].forEach(t=>gasto(t, Extrato.classificar(t, S.regras).cat)); });
  R.taxas.forEach(x=>gasto(x.t, 'outros'));
  R.creditos.forEach(x=>gasto(x.t, (Extrato.classificar(x.t, S.regras).cat) || 'outros'));
  R.naoReconhecidos.forEach(x=>gasto(x.t, x.c && x.c.cat));
  const nCont = S.contestar.filter(x=>x.m===m && x.status==='aberta').length;
  S.conferidas[m] = {em:HOJE(), total:Math.round(R.totalCalculado*100)/100, contestar:nCont};
  save(); fechar(); UI.tab = 'cartoes'; UI.mes = m; render(); window.scrollTo({top:0}); vibrar(30);
  toast(nCont ? `Fatura conferida. ${nCont} pra contestar.` : 'Fatura conferida ✓ tudo certo', true);
}

/* ══════════════════ ações ══════════════════ */
function toast(msg, undo, acao){
  const t = document.getElementById('toast'), a = document.getElementById('tacao');
  t.querySelector('span').textContent = msg;
  document.getElementById('undo').classList.toggle('hide', !undo || !undoSnap);
  UI.toastAcao = acao ? acao.fn : null;
  a.classList.toggle('hide', !acao); a.textContent = acao ? acao.txt : '';
  t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), acao ? 7000 : 4500);
}
function desfazer(){
  if(!undoSnap) return;
  S = normaliza(JSON.parse(undoSnap)); undoSnap = null; save(); render();
  document.getElementById('toast').classList.remove('on');
}
function baixar(nome, tipo, texto){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto],{type:tipo}));
  a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function exportarCSV(){
  const linhas = [['data','descricao','categoria','envelope','forma','valor']];
  S.lanc.slice().sort((a,b)=>a.d<b.d?-1:1).forEach(l=>{
    const c = CAT[l.c]||CAT.outros, e = envDe(l);
    linhas.push([ddmm(l.d)+'/'+l.d.slice(0,4), l.t||c.n, c.n, e==='mae'?nomeMae():ENV[e].n, l.f==='mae'?nomeMae():l.f==='pix'?'Pix/débito':'Cartão', fmtIn(l.v)]);
  });
  baixar('gastos-'+HOJE()+'.csv','text/csv;charset=utf-8','﻿'+linhas.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n'));
}
function lerImport(d){
  if(d && d.v===2 && Array.isArray(d.itens)) return normaliza(JSON.parse(JSON.stringify(d)));
  if(d && d.metas && Array.isArray(d.lanc)){ const s = vazio(); s.lanc = lancDoV1(d); s.novo = true; return s; }
  throw new Error('formato');
}
function prepararImport(d){
  try{ UI.imp = lerImport(d); abrir('imp'); }
  catch(e){ toast('Esse arquivo não parece um backup do app'); }
}
function aplicarImport(){
  const d = UI.imp; if(!d) return;
  snap();
  if(!d.lanc.length && S.lanc.length) d.lanc = S.lanc;
  d.novo = false; S = d; UI.imp = null; UI.tab = 'painel'; UI.mes = MES();
  save(); fechar(); render(); toast('Dados importados', true);
}
function importarHash(){
  const h = location.hash;
  if(!h.startsWith('#importar=')) return;
  try{
    const b = h.slice(10).replace(/-/g,'+').replace(/_/g,'/');
    const bin = atob(b + '==='.slice((b.length+3)%4));
    const json = new TextDecoder().decode(Uint8Array.from(bin, c=>c.charCodeAt(0)));
    prepararImport(JSON.parse(json));
  }catch(e){ toast('O link de importação está incompleto'); }
  history.replaceState(null, '', location.pathname + location.search);
}

/* ══════════════════ eventos ══════════════════ */
document.addEventListener('click', e => {
  if(CAD.travado){
    const k = e.target.closest('#cadeado [data-act]'); if(!k) return;
    const a = k.dataset.act;
    if(a==='pin-tecla') teclaPin(k.dataset.v);
    else if(a==='pin-esqueci'){ CAD.esqueci = true; renderCadeado(); }
    else if(a==='pin-apagar'){
      if(!CAD.confApagar){ CAD.confApagar = true; k.textContent = 'Toque de novo para apagar tudo'; return; }
      try{ localStorage.removeItem(KEY); indexedDB.deleteDatabase('financeiro-comprovantes'); }catch(_){}
      location.reload();
    }
    return;
  }
  if(e.target.closest('#tacao')){ const f = UI.toastAcao; document.getElementById('toast').classList.remove('on'); if(f) f(); return; }
  const nav = e.target.closest('#nav button[data-tab]');
  if(nav){ UI.tab = nav.dataset.tab; if(UI.tab!=='futuro') UI.sel = null; render(); window.scrollTo({top:0}); return; }
  if(e.target.closest('#fab')){ if(S.novo){ toast('Importe seus dados ou comece do zero primeiro'); return; } UI.add = novoAdd(); abrir('add'); return; }
  if(e.target.closest('#tapclose')){ fechar(); return; }
  if(e.target.closest('#undo')){ desfazer(); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, v = b.dataset.v;

  switch(a){
    case 'tab': UI.tab = v; UI.sub = b.dataset.sub || 'plano'; UI.mes = MES(); render(); window.scrollTo({top:0}); break;
    case 'ir': UI.tab = v; if(b.dataset.sub) UI.sub = b.dataset.sub; render(); window.scrollTo({top:0}); break;
    case 'sub': UI.sub = v; render(); break;
    case 'selF': UI.selF = +v; render(); break;
    case 'novo-parc': abrirItem(null, UI.mes, 'cartao'); UI.ed.rep = 'parc'; renderSheet(); break;
    case 'mes': UI.mes = ymAdd(UI.mes, +v); render(); break;
    case 'ajustes': abrir('ajustes'); break;
    case 'fechar': fechar(); break;
    case 'voltar': UI.conf = null; renderSheet(); break;
    case 'cancelar': UI.conf = null; renderSheet(); break;
    case 'dica': UI.aberta = UI.aberta==='dica'+v ? null : 'dica'+v; render(); break;
    case 'sel': UI.sel = +v; render(); break;

    case 'zero': set(s=>{ s.novo = false; }); UI.tab = 'mes'; render(); toast('Comece pelas entradas e contas do mês'); break;
    case 'importar': document.getElementById('i-import').click(); break;
    case 'imp-ok': aplicarImport(); break;
    case 'export': baixar('financeiro-'+HOJE()+'.json','application/json',JSON.stringify(S,null,1)); break;
    case 'csv': exportarCSV(); break;
    case 'reset': UI.conf = 'reset'; renderSheet(); break;
    case 'reset-ok': snap(); S = vazio(); save(); fechar(); UI.tab='painel'; render(); toast('Tudo apagado', true); break;

    case 'ob-ok': {
      const vd = nnum(document.getElementById('ob-dia').value), vo = nnum(document.getElementById('ob-out').value);
      const d = S.onboard.mes + '-01'; snap();
      set(s=>{ if(vd) s.lanc.push({id:uid(), d, v:vd, c:'diaria', f:'pix', t:'Gastos antes do app'});
               if(vo) s.lanc.push({id:uid(), d, v:vo, c:'outros', f:'pix', t:'Gastos antes do app'}); s.onboard = null; });
      toast('Lançado', true); break; }
    case 'ob-pular': set(s=>{ s.onboard = null; }); break;

    case 'reserva': abrir('reserva'); break;
    case 'reserva-est': snap(); set(s=>{ s.reserva = {v:Math.round(reservaInicio()*100)/100, em:HOJE()}; }); toast('Reserva atualizada', true); break;
    case 'salvar-reserva': { const val = nnum(document.getElementById('r-v').value); snap(); S.reserva = {v:val, em:HOJE()}; save(); fechar(); render(); toast('Reserva atualizada', true); break; }

    case 'pagar': {
      const m = b.dataset.m, id = b.dataset.id;
      const c = contasDoMes(m).find(x=>x.id===id); if(!c) break;
      snap();
      set(s=>{ s.pagos[m] = s.pagos[m]||{};
        if(s.pagos[m][id]) delete s.pagos[m][id];
        else s.pagos[m][id] = m===MES() ? HOJE() : (m < MES() ? m+'-'+pad2(Math.min(c.dia||1,diasMes(m))) : true); });
      if(S.pagos[m][id]){
        vibrar(20);
        const falta = contasDoMes(m).filter(x=>!resolvida(x,m)).length;
        toast(falta ? c.nome+' paga ✓' : 'Todas as contas de '+mesNome(m)+' pagas 🎉', true,
          window.Comprovantes && !temComp(id,m) ? {txt:'📎 comprovante', fn:()=>pedirComprovante(id, m)} : null);
        if(UI.sheet==='rev') renderSheet();
      } else toast(c.nome+' desmarcada', true);
      break; }

    // lançamentos
    case 'ed-lanc': { const l = S.lanc.find(x=>x.id===b.dataset.id); if(!l) break;
      UI.add = {id:l.id, amt:fmtIn(l.v).replace(/,00$/,''), c:l.c, f:l.f, t:l.t||'', d:l.d}; abrir('add'); break; }
    case 'key': tecla(v); break;
    case 'cat': {
      const A = UI.add, d = document.getElementById('i-desc'); if(d) A.t = d.value;
      A.c = v;
      if(v==='mercado' && !A.id){ const P = plano(A.d.slice(0,7)); if(P.mae > gastos(A.d.slice(0,7)).mae) A.f = 'mae'; }
      renderSheet(); break; }
    case 'forma': { const d = document.getElementById('i-desc'); if(d) UI.add.t = d.value; UI.add.f = v; renderSheet(); break; }
    case 'parc': { const d = document.getElementById('i-desc'); if(d) UI.add.t = d.value; UI.add.n = +v; renderSheet(); break; }
    case 'salvar-lanc': salvarLanc(); break;
    case 'del-lanc': { const id = UI.add.id; snap(); set(s=>{ s.lanc = s.lanc.filter(x=>x.id!==id); }); fechar(); toast('Gasto excluído', true); break; }

    // itens
    case 'ed-item': if(b.dataset.id) abrirItem(b.dataset.id, b.dataset.m || UI.mes); break;
    case 'novo-item': abrirItem(null, UI.mes, v); break;
    case 'e-tipo': lerItemForm(); UI.ed.tipo = v; renderSheet(); break;
    case 'e-rep': lerItemForm(); UI.ed.rep = v; renderSheet(); break;
    case 'e-escopo': lerItemForm(); UI.ed.escopo = v; renderSheet(); break;
    case 'salvar-item': salvarItem(); break;
    case 'pre-del': lerItemForm(); UI.conf = 'del'; renderSheet(); break;
    case 'del-item': delItem(v); break;

    // objetivos
    case 'novo-obj': { const o = {id:uid(), nome:'Novo objetivo', itens:[{n:'Item', v:0}]}; S.objetivos.push(o); save(); UI.ed = o.id; abrir('obj'); break; }
    case 'ed-obj': UI.ed = b.dataset.id; abrir('obj'); break;
    case 'obj-ok': { const o = S.objetivos.find(x=>x.id===b.dataset.id); if(!o) break; snap(); set(()=>{ o.itens[+v].ok = !o.itens[+v].ok; }); break; }
    case 'obj-add-it': { const o = lerObj(); if(o){ o.itens.push({n:'', v:0}); renderSheet(); } break; }
    case 'obj-del-it': { const o = lerObj(); if(o){ o.itens.splice(+v,1); renderSheet(); } break; }
    case 'salvar-obj': { snap(); lerObj(); save(); fechar(); render(); break; }
    case 'del-obj': { snap(); const id = UI.ed; set(s=>{ s.objetivos = s.objetivos.filter(x=>x.id!==id); }); fechar(); toast('Objetivo apagado', true); break; }

    case 'sim': UI.sim = 500; abrir('sim'); break;

    // privacidade
    case 'discreto': S.seg.discreto = !S.seg.discreto; save(); renderView(); if(UI.sheet==='ajustes') renderSheet();
      toast(S.seg.discreto ? 'Valores escondidos' : 'Valores à mostra'); break;
    case 'cadeado': UI.pin = {minutos:S.seg.minutos||5, dica:(S.seg.pin&&S.seg.pin.dica)||''}; abrir('pin'); break;
    case 'p-min': { const d = document.getElementById('p-dica'); if(d) UI.pin.dica = d.value; UI.pin.minutos = +v; renderSheet(); break; }
    case 'p-salvar': {
      const a1 = document.getElementById('p-1').value, a2 = document.getElementById('p-2').value, dica = document.getElementById('p-dica').value.trim();
      if(!/^\d{4,6}$/.test(a1)){ toast('O PIN precisa ter de 4 a 6 números'); break; }
      if(a1 !== a2){ toast('Os dois PINs não são iguais'); break; }
      if(!(window.crypto && crypto.subtle)){ toast('Este navegador não deixa usar cadeado aqui'); break; }
      const sal = hexDe(crypto.getRandomValues(new Uint8Array(16)));
      hashPin(a1, sal).then(hash=>{ S.seg.pin = {sal, hash, n:a1.length, dica}; S.seg.minutos = UI.pin.minutos; save(); fechar(); render();
        toast('Cadeado ligado 🔒 Não esqueça o PIN: sem ele, só apagando os dados.'); });
      break; }
    case 'p-tirar': snap(); S.seg.pin = null; save(); fechar(); render(); toast('Cadeado desligado', true); break;

    // agora, revisão e “quero comprar”
    case 'agora-tudo': UI.agoraTudo = !UI.agoraTudo; renderView(); break;
    case 'rev': UI.rev = {p:1}; abrir('rev'); break;
    case 'rev-prox':
      if(UI.rev.p < 4){ UI.rev.p++; renderSheet(); document.getElementById('sheet').scrollTop = 0; }
      else { if(S.revisoes[S.revisoes.length-1]!==HOJE()) S.revisoes.push(HOJE()); S.revisoes = S.revisoes.slice(-60); save(); fechar(); render(); vibrar(30);
        const n = sequencia(); toast('Revisão feita 🎉' + (n>1 ? ' ' + n + ' semanas seguidas!' : ' Até a próxima semana.')); }
      break;
    case 'rev-lancar': UI.depois = () => abrir('rev'); UI.add = novoAdd(); abrir('add'); break;
    case 'desejo': UI.ed = b.dataset.id; abrir('desejo'); break;
    case 'desejo-novo': {
      const n = (document.getElementById('s-nome').value || '').trim();
      if(!n){ toast('Diga o que é (ex.: tênis)'); break; }
      if(!UI.sim){ toast('Coloque o valor'); break; }
      S.desejos.push({id:uid(), n, v:UI.sim, em:Date.now(), fim:null}); save(); fechar(); render();
      toast('Anotado. Daqui a 48 h eu pergunto se ainda quer 😉'); break; }
    case 'desejo-sim': { const d = S.desejos.find(x=>x.id===UI.ed); if(!d) break; d.fim = 'comprei'; d.fimEm = HOJE(); save();
      UI.add = Object.assign(novoAdd(), {amt:fmtIn(d.v).replace(/,00$/,''), c:'compras', t:d.n}); abrir('add'); break; }
    case 'desejo-nao': { const d = S.desejos.find(x=>x.id===UI.ed); if(!d) break; d.fim = 'desisti'; d.fimEm = HOJE(); save(); fechar(); render(); vibrar(30);
      toast(brl(d.v,0)+' ficaram com você 💪'); break; }
    case 'desejo-apagar': snap(); S.desejos = S.desejos.filter(x=>x.id!==UI.ed); save(); fechar(); render(); toast('Tirado da lista', true); break;

    // comprovantes
    case 'comp': abrirCofre(v && /^\d{4}-\d{2}$/.test(v) ? v : MES()); break;
    case 'comp-mes': UI.compMes = ymAdd(UI.compMes, +v); UI.compLista = null; renderSheet(); carregarCofre(); break;
    case 'comp-add': pedirComprovante(b.dataset.ref, b.dataset.m); break;
    case 'comp-novo': UI.compAlvo = {m:UI.compMes || MES()}; document.getElementById('i-comp').click(); break;
    case 'comp-ver': verComp(v); break;
    case 'comp-apagar':
      if(UI.conf !== 'apagar:'+v){ UI.conf = 'apagar:'+v; renderSheet(); break; }
      Comprovantes.apagar(v).then(()=>{ UI.conf = null; toast('Comprovante apagado'); carregarCofre(); atualizaSemComp(true); }); break;
    case 'comp-zip':
      if(!window.Comprovantes) break;
      toast('Montando o .zip…');
      Comprovantes.exportarZip().then(blob=>{ baixarBlob('comprovantes-'+HOJE()+'.zip', blob); S.zipEm = HOJE(); save(); render(); toast('Backup baixado. Guarde no Drive ✓'); })
        .catch(e=>toast((e && e.message) || 'Não deu pra montar o .zip'));
      break;
    case 'compqual-ref': UI.compNovo.ref = v; renderSheet(); break;
    case 'compqual-ok': { const N = UI.compNovo; if(N && N.ref) salvarComp(N.file, N.ref, N.m, N.info); break; }

    // conferir fatura
    case 'conf': abrirConf(); break;
    case 'cf-arq': document.getElementById('i-fat').click(); break;
    case 'cf-ler': { const t = document.getElementById('cf-txt'); if(!t || !t.value.trim()){ toast('Cole o texto da fatura'); break; }
      prepararFatura(Extrato.lerTexto(t.value, {ano:+HOJE().slice(0,4), conta:'cartao'}), 'texto colado'); renderSheet(); break; }
    case 'cf-mes': UI.cf.m = v; renderSheet(); break;
    case 'cf-rodar': rodarConf(); renderSheet(); document.getElementById('sheet').scrollTop = 0; break;
    case 'cf-cat': { const F = UI.cf, c = F.fila[F.i], k = chaveDec(c); F.dec[k] = Object.assign({}, F.dec[k], {cat:v}); renderSheet(); break; }
    case 'cf-lote': { const F = UI.cf, L = F.dec.lote = F.dec.lote || {}; L[v] = L[v]==='contestar' ? null : 'contestar'; renderSheet(); break; }
    case 'cf-dec': {
      const F = UI.cf, c = F.fila[F.i], k = chaveDec(c);
      if(c.tipo!=='lote') F.dec[k] = Object.assign({}, F.dec[k], {acao:v});
      vibrar(10);
      if(F.i < F.fila.length-1) F.i++; else F.etapa = 'fim';
      renderSheet(); document.getElementById('sheet').scrollTop = 0; break; }
    case 'cf-pular': { const F = UI.cf; if(F.i < F.fila.length-1) F.i++; else F.etapa = 'fim'; renderSheet(); break; }
    case 'cf-volta': { const F = UI.cf; if(F.etapa==='fim') F.etapa = 'cartas'; else if(F.i) F.i--; renderSheet(); break; }
    case 'cf-ok': aplicarConferencia(); break;
    case 'contest-ok': { const x = S.contestar.find(c=>c.id===v); if(x){ snap(); x.status = 'resolvida'; save(); render(); toast('Marcada como resolvida ✓', true); } break; }

    case 'agenda': gerarAgenda(); break;

    // cenário e piso
    case 'cen': abrirCen(); break;
    case 'inicio': snap(); set(s=>{ s.cenario.inicio = v || null; }); toast(v ? 'Plantões a partir de '+mesNome(v) : 'Sem plantão na conta', true); break;
    case 'piso': snap(); set(s=>{ s.cenario.piso = +v; }); toast('Piso: '+brl(+v,0), true); break;
    case 'c-inicio': lerCen(); UI.cen.c.inicio = v || null; renderSheet(); break;
    case 'c-add-marco': { lerCen(); const t = document.getElementById('c-mt').value.trim(), d = document.getElementById('c-md').value;
      if(!t || !d){ toast('Preencha o nome e o dia'); break; }
      UI.cen.marcos.push({d, t}); UI.cen.marcos.sort((a,b)=>a.d<b.d?-1:1); renderSheet(); break; }
    case 'c-del-marco': lerCen(); UI.cen.marcos.splice(+v,1); renderSheet(); break;
    case 'salvar-cen': lerCen(); snap(); S.cenario = UI.cen.c; S.marcos = UI.cen.marcos; save(); fechar(); render(); toast('Cenário salvo', true); break;
    case 'ver-mes': UI.tab = 'mes'; UI.sub = 'plano'; UI.mes = v; render(); window.scrollTo({top:0}); break;

    // extrato do banco
    case 'ext': abrirExtrato(); break;
    case 'ext-arq': document.getElementById('i-ext').click(); break;
    case 'ext-ler': { const t = document.getElementById('ext-txt'); if(t && t.value.trim()) lerTextoExtrato(t.value); else toast('Cole o texto do extrato'); break; }
    case 'ext-novo': abrirExtrato(); break;
    case 'ext-lin': UI.ext.aberta = UI.ext.aberta===+v ? null : +v; renderSheet(); break;
    case 'ext-grupo': UI.ext.grupos[v] = !UI.ext.grupos[v]; renderSheet(); break;
    case 'ext-fonte': UI.ext.arqs[+b.dataset.a].fonte = v; UI.ext.aberta = null; montarRevisao(); renderSheet(); break;
    case 'ext-cat': {
      const X = UI.ext, l = X.linhas[+b.dataset.i]; if(!l) break;
      if(l.chave) X.regras[l.chave] = v==='ignorar' ? 'transferencia' : v;
      X.linhas.forEach(o=>{ if(o===l || (l.chave && o.chave===l.chave && Math.sign(o.t.valor)===Math.sign(l.t.valor) && ['gasto','entrada','ignorar'].includes(o.acao))) escolherExt(o, v); });
      X.aberta = null; renderSheet(); break; }
    case 'ext-antes': UI.ext.apagarAntes = b.checked; break;
    case 'ext-ok': aplicarExtrato(); break;
    case 'regras-limpar': snap(); set(s=>{ s.regras = {}; }); renderSheet(); toast('Regras apagadas', true); break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if(t.id==='i-desc' && UI.add){ UI.add.t = t.value; return; }
  if(t.id==='s-r' || t.id==='s-v'){
    UI.sim = t.id==='s-r' ? +t.value : nnum(t.value);
    if(t.id==='s-r') document.getElementById('s-v').value = fmtIn(UI.sim);
    else document.getElementById('s-r').value = Math.min(UI.sim,10000);
    document.getElementById('sim-out').innerHTML = simOut();
    return;
  }
  if(t.dataset.cfg2==='nome'){ S.nome = t.value.trim().slice(0,30); save(); return; }
  if(t.dataset.cfg){
    const [a,k] = t.dataset.cfg.split('.');
    S[a][k] = a==='cartao' ? (Math.min(Math.max(parseInt(t.value,10)||0,0),31) || null) : nnum(t.value);
    save(); return;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id==='i-data' && UI.add){ const d = document.getElementById('i-desc'); if(d) UI.add.t = d.value; UI.add.d = t.value || HOJE(); renderSheet(); }
  if(t.id==='i-comp' && t.files.length){ const f = t.files[0], alvo = UI.compAlvo || {m:MES()}; t.value = ''; anexar(f, alvo); return; }
  if(t.id==='i-fat' && t.files.length){ const fs = [...t.files]; t.value = ''; lerFatura(fs); return; }
  if(t.id==='i-ext' && t.files.length){ const fs = [...t.files]; t.value = ''; lerArquivosExtrato(fs); return; }
  if(t.id==='i-import' && t.files[0]){
    const fr = new FileReader();
    fr.onload = () => { try{ prepararImport(JSON.parse(fr.result)); }catch(_){ toast('Esse arquivo não parece um backup do app'); } };
    fr.readAsText(t.files[0]); t.value = '';
  }
  if(t.dataset && t.dataset.cfg) renderView();
});
document.addEventListener('keydown', e => {
  if(CAD.travado){ if(/^\d$/.test(e.key)) teclaPin(e.key); else if(e.key==='Backspace') teclaPin('⌫'); e.preventDefault(); return; }
  if(e.key==='Escape' && UI.sheet){ fechar(); return; }
  if(UI.sheet==='add'){
    const emCampo = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if(emCampo){ if(e.key==='Enter'){ e.preventDefault(); salvarLanc(); } return; }
    if(/^[0-9]$/.test(e.key)){ e.preventDefault(); tecla(e.key); }
    else if(e.key===','||e.key==='.'){ e.preventDefault(); tecla(','); }
    else if(e.key==='Backspace'){ e.preventDefault(); tecla('⌫'); }
    else if(e.key==='Enter'){ e.preventDefault(); salvarLanc(); }
  }
});
window.addEventListener('hashchange', importarHash);

/* volta para o app depois de horas: o dia (e o mês) podem ter mudado */
let ultimoDia = HOJE();
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState==='hidden'){ CAD.fora = Date.now(); return; }
  if(temPin() && CAD.fora && Date.now() - CAD.fora > (S.seg.minutos||5)*60000) travar();
  CAD.fora = null;
  if(document.visibilityState==='visible' && HOJE()!==ultimoDia){
    if(UI.mes===ultimoDia.slice(0,7)) UI.mes = MES();
    ultimoDia = HOJE(); if(!UI.sheet) render();
  }
});

/* ══════════════════ início ══════════════════ */
S = load();
render();
if(temPin()) travar();
importarHash();
pegarCompartilhados();
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
