<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Financeiro Rian</title>
<meta name="theme-color" content="#f2f2f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<meta name="description" content="App pessoal e privado.">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
:root{
  color-scheme:light dark;
  --bg:#f2f2f3; --card:#fbfbfb; --surface:#e7e7e9; --text:#1d1f20;
  --acc:#5980a6; --acc-soft:#b5d9fd; --acc-strong:#416180; --acc-deep:#2c455d;
  --hero:#1d2d3d; --on-hero:#f2f2f3; --on-acc:#f7f9fb;
  --warn:#a84f2a; --warn-bg:#f6e6dd; --ok:#2f6f4f; --ok-bg:#e1efe7;
  --mut:color-mix(in srgb,var(--text) 58%,transparent);
  --mut2:color-mix(in srgb,var(--text) 76%,transparent);
  --div:color-mix(in srgb,var(--text) 14%,transparent);
  --track:color-mix(in srgb,var(--acc) 16%,transparent);
  --fh:"Barlow Condensed",system-ui,sans-serif;
  --fb:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sh:0 10px 30px color-mix(in srgb,#1d2d3d 22%,transparent);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14171a; --card:#1b1f23; --surface:#252a2f; --text:#e6e7e8;
    --acc:#7ea6cd; --acc-soft:#3e5f80; --acc-strong:#a9c8e6; --acc-deep:#d3e5f6;
    --hero:#0e1b27; --on-hero:#eef2f6; --on-acc:#0e1418;
    --warn:#eb9a74; --warn-bg:#3a2419; --ok:#86c9a3; --ok-bg:#183126;
    --track:color-mix(in srgb,var(--acc) 20%,transparent);
    --sh:0 10px 30px rgba(0,0,0,.5);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}

/* casca */
#shell{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
#topo{position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(var(--safe-t) + 12px) 16px 10px;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--div)}
#topo h1{margin:0;font-family:var(--fh);font-weight:600;font-size:26px;line-height:1;flex:1;min-width:0}
#topo .sub{display:block;font-family:var(--fb);font-weight:400;font-size:12.5px;color:var(--mut);margin-top:3px}
#view{flex:1;padding:16px 16px calc(110px + var(--safe-b));display:flex;flex-direction:column;gap:18px}
#aviso{background:var(--warn-bg);color:var(--text);padding:10px 16px;font-size:13px}

/* tipografia */
.num{font-family:var(--fh);font-weight:500;font-variant-numeric:tabular-nums}
.big{font-family:var(--fh);font-weight:600;line-height:1}
.lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
.mut{color:var(--mut)} .mut2{color:var(--mut2)}
.warn{color:var(--warn)} .ok{color:var(--ok)}
.small{font-size:13px} .tiny{font-size:12px}

/* cartões */
.card{background:var(--card);border:1px solid var(--div);padding:14px 16px}
.card.flush{padding:0}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.hd .lnk{background:none;border:0;padding:4px 0;color:var(--acc-strong);font-size:13.5px;font-weight:600}
.hero{background:var(--hero);color:var(--on-hero);border:1px solid var(--hero)}
.hero .lbl,.hero .mut{color:color-mix(in srgb,var(--on-hero) 66%,transparent)}
.nota{border:1px solid var(--div);border-left:3px solid var(--acc);background:var(--card);padding:12px 14px}
.nota.warn-n{border-left-color:var(--warn)}

/* linhas de lista */
.rows>*{border-top:1px solid var(--div)}
.rows>*:first-child{border-top:0}
.r{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:52px;width:100%;background:none;border:0;text-align:left}
button.r:active,.r.tap:active{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.r .tx{flex:1;min-width:0}
.r .tx>b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .tx>span{display:block;font-size:12.5px;color:var(--mut)}
.r .v{font-family:var(--fh);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:11px 16px;border-top:1px solid var(--div);font-weight:600}
.sig{flex:none;width:34px;height:34px;border:1px solid var(--div);display:flex;align-items:center;justify-content:center;
  font-family:var(--fh);font-size:12.5px;font-weight:600;color:var(--acc-strong)}
.sig.mae{background:var(--acc-soft);border-color:transparent;color:var(--text)}
.sig.out{border-color:var(--acc-strong)}

/* check de conta paga */
.chk{flex:none;width:30px;height:30px;border:1.5px solid var(--div);background:transparent;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
.chk svg{opacity:0}
.chk.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.chk.on svg{opacity:1}
.chk.auto{border-style:dashed}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:9px;background:var(--surface);color:var(--mut2)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.acc{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc-strong)}

/* medidor */
.meter{height:8px;background:var(--track);position:relative;overflow:hidden;border-radius:0 4px 4px 0}
.meter>i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:0 4px 4px 0}
.meter.over>i{background:var(--warn)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;
  border:1px solid var(--div);background:var(--card);font-family:var(--fh);font-weight:600;font-size:16px;line-height:1.1}
.btn:active{opacity:.7}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.blk{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--acc-strong)}
.btn.dng{color:var(--warn)}
.btns{display:flex;gap:8px}
.btns>*{flex:1}
.ico{background:none;border:1px solid var(--div);width:40px;height:40px;display:flex;align-items:center;justify-content:center;padding:0;flex:none}

/* troca de mês */
.mswitch{display:flex;align-items:center;gap:2px}
.mswitch button{background:none;border:0;width:36px;height:40px;font-size:22px;color:var(--acc-strong);padding:0}
.mswitch span{font-family:var(--fh);font-weight:600;font-size:17px;min-width:64px;text-align:center}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:520px;margin:0 auto;background:var(--bg);
  border-top:1px solid var(--div);display:flex;height:calc(64px + var(--safe-b));padding-bottom:var(--safe-b)}
#nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11.5px;font-weight:600;color:var(--mut);padding:0}
#nav button.on{color:var(--acc-strong)}
#nav svg{width:22px;height:22px}
#nav #fab{flex:none;width:58px;height:58px;margin:-20px 6px 0;background:var(--acc);color:var(--on-acc);border:0;
  box-shadow:var(--sh);font-family:var(--fh);font-size:34px;line-height:1;display:flex;align-items:center;justify-content:center}
#nav #fab:active{opacity:.8}

/* sheet */
#backdrop{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#0e1b27 50%,transparent);display:none;flex-direction:column;justify-content:flex-end}
#backdrop.on{display:flex}
#tapclose{flex:1;min-height:24px}
#sheet{background:var(--bg);max-width:520px;width:100%;margin:0 auto;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;
  padding:16px 16px calc(18px + var(--safe-b));box-shadow:var(--sh);animation:up .16s ease-out}
#backdrop.full #tapclose{display:none}
#backdrop.full #sheet{max-height:none;height:100dvh;padding-top:calc(var(--safe-t) + 14px)}
@keyframes up{from{transform:translateY(16px);opacity:.5}to{transform:none;opacity:1}}
.sh-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sh-hd h2{margin:0;font-family:var(--fh);font-weight:600;font-size:22px}
.x{background:none;border:0;font-size:15px;color:var(--acc-strong);font-weight:600;padding:8px 2px}

/* formulários */
.inp{width:100%;min-height:44px;padding:9px 11px;font-size:16px;background:var(--card);border:1px solid var(--div);border-radius:0}
.inp:focus{border-color:var(--acc)}
.inp.n{font-family:var(--fh);font-size:18px;font-variant-numeric:tabular-nums}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld>span{font-size:13px;color:var(--mut2)}
.row2{display:flex;gap:10px}
.row2>*{flex:1;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:38px;padding:7px 12px;border:1px solid var(--div);background:var(--card);font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cats .chip{padding:7px 4px;font-size:13px;line-height:1.15}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys button{min-height:48px;border:1px solid var(--div);background:var(--card);font-family:var(--fh);font-size:24px;font-weight:500}
.keys button:active{background:var(--surface)}
.amt{border:1px solid var(--div);background:var(--card);padding:12px 14px;margin-bottom:10px}
.amt .big{font-size:44px}
.sw{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14.5px}
.sw input{width:20px;height:20px;accent-color:var(--acc)}

/* gráfico de colunas */
.cols{display:flex;align-items:flex-end;gap:2px;height:130px;border-bottom:1px solid var(--div);position:relative}
.cols .c{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;background:none;border:0;padding:0;cursor:pointer}
.cols .c i{display:block;width:100%;max-width:24px;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.cols .c.neg i{background:var(--warn)}
.cols .c.sel i{background:var(--acc-strong)}
.cols .c:hover i{opacity:.85}
.xl{display:flex;gap:2px;margin-top:5px}
.xl span{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.readout{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;min-height:24px}

/* semana */
.wk{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.wk .d{display:flex;flex-direction:column;align-items:center;gap:4px}
.wk .bar{height:54px;width:100%;max-width:24px;display:flex;align-items:flex-end;background:var(--track);border-radius:4px 4px 0 0;overflow:hidden}
.wk .bar i{display:block;width:100%;background:var(--acc)}
.wk .bar.over i{background:var(--warn)}
.wk .d.fut{opacity:.45}
.wk .dn{font-size:12px;font-weight:600;color:var(--mut)}
.wk .d.hj .dn{color:var(--acc-strong)}
.wk .dv{font-family:var(--fh);font-size:13px;font-variant-numeric:tabular-nums;color:var(--mut2)}

/* barras horizontais */
.hb{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:8px 10px}
.hb .t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .b{height:14px;display:flex}
.hb .b i{display:block;background:var(--acc);border-radius:0 4px 4px 0;min-width:2px}
.hb .v{font-family:var(--fh);font-size:15px;font-variant-numeric:tabular-nums;text-align:right}

/* tabela */
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600;text-align:right;padding:8px 16px 6px}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb td{padding:8px 16px;border-top:1px solid var(--div);text-align:right;font-family:var(--fh);font-size:15.5px;font-variant-numeric:tabular-nums}
.tb td:first-child{font-family:var(--fb);font-size:14px}

#toast{position:fixed;left:12px;right:12px;bottom:calc(76px + var(--safe-b));z-index:45;max-width:496px;margin:0 auto;
  background:var(--hero);color:var(--on-hero);padding:12px 14px;display:none;justify-content:space-between;align-items:center;gap:10px;box-shadow:var(--sh)}
#toast.on{display:flex}
#toast button{background:none;border:0;color:var(--acc-soft);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:4px}
@media (prefers-color-scheme:dark){#toast button{color:var(--acc)}}
.dica{display:block;text-align:left;width:100%}
.empty{padding:18px 16px;color:var(--mut);font-size:14px}
.pseg{display:flex;gap:2px}
.pseg i{flex:1;height:8px;background:var(--track)}
.pseg i.pg{background:var(--acc)}
.pseg i.at{background:var(--acc-strong)}
.seg{display:flex;border:1px solid var(--div);background:var(--card)}
.seg button{flex:1;min-height:40px;border:0;background:none;font-weight:600;font-size:14px;color:var(--mut2)}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none;min-height:34px;padding:5px 11px}
.limpo{background:none;border:0;padding:0;color:inherit;font:inherit;text-align:inherit;cursor:pointer}
.lnk{color:var(--acc-strong);font-weight:600}
.lnk-h{color:var(--acc-soft);font-weight:600;text-decoration:underline}
.hero .alerta{color:#f3a683;font-weight:600}
.mini{display:flex;align-items:flex-end;gap:8px;height:100px;margin-top:14px;position:relative}
.mini .mc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.mini .mc i{display:block;width:100%;max-width:24px;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.mini .mc i.baixo{background:#e08a63}
.mini .mv{font-family:var(--fh);font-size:13px;line-height:16px;font-variant-numeric:tabular-nums}
.hero .xl span{color:color-mix(in srgb,var(--on-hero) 66%,transparent)}
.piso{position:absolute;left:0;right:0;border-top:1.5px solid var(--warn);pointer-events:none}
.hero .piso{border-top-color:#f3a683}
.leg{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:11.5px;color:var(--mut);margin-top:4px}
.leg i{display:block;width:14px;border-top:1.5px solid var(--warn)}
.hero .leg{color:color-mix(in srgb,var(--on-hero) 66%,transparent)}
.hero .leg i{border-top-color:#f3a683}
.txt{width:100%;min-height:120px;padding:10px;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--card);border:1px solid var(--div);border-radius:0;resize:vertical}
.stick{position:sticky;bottom:calc(-18px - var(--safe-b));background:var(--bg);padding:10px 0 calc(12px + var(--safe-b));margin-top:12px;border-top:1px solid var(--div)}
.xr.on{background:color-mix(in srgb,var(--acc) 8%,transparent)}
details.como{margin-top:14px;border-top:1px solid var(--div);padding-top:6px}
details.como summary{cursor:pointer;font-weight:600;padding:8px 0;color:var(--acc-strong)}
details.como p{margin:0 0 8px}
.agora{border-left:3px solid var(--acc)}
.agora.feito{border-left-color:var(--ok)}
.passos{display:flex;gap:4px;margin:0 0 10px}
.passos i{flex:1;height:4px;background:var(--track)}
.passos i.on{background:var(--acc)}
.carta{border:1px solid var(--div);background:var(--card);padding:12px 14px;margin-bottom:8px}
.arq{display:flex;align-items:center;gap:10px;padding:8px 0 0}
.arq .tx{flex:1;min-width:0}
.arq .tx b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arq .tx span{display:block;font-size:12px;color:var(--mut)}
.thumb{width:44px;height:44px;object-fit:cover;flex:none;border:1px solid var(--div)}
.thumb.pdf{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--warn);background:var(--card)}
#cadeado{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + var(--safe-b))}
#cadeado.hide{display:none}
.cad{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;text-align:center}
.pontos{display:flex;gap:14px;margin:22px 0 8px}
.pontos i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc)}
.pontos i.on{background:var(--acc)}
.treme{animation:treme .3s}
@keyframes treme{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#toast #tacao{color:var(--on-hero);border:1px solid color-mix(in srgb,var(--on-hero) 40%,transparent);padding:6px 10px;text-transform:none;letter-spacing:0;font-size:13.5px}
.discreto .big,.discreto .num,.discreto .v,.discreto .mv,.discreto .dv,.discreto .tb td:not(:first-child){filter:blur(8px)}
.discreto #sheet .big,.discreto #sheet .v,.discreto #sheet .num{filter:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 16px 2px;border-top:1px solid var(--div)}
.dh:first-child{border-top:0}
</style>
</head>
<body>
<div id="shell">
  <div id="aviso" class="hide"></div>
  <header id="topo"></header>
  <main id="view"></main>
</div>
<nav id="nav">
  <button data-tab="painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="9"/><rect x="13.5" y="3.5" width="7" height="5"/><rect x="13.5" y="11.5" width="7" height="9"/><rect x="3.5" y="15.5" width="7" height="5"/></svg>Painel</button>
  <button data-tab="mes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Mês</button>
  <button id="fab" aria-label="Lançar gasto">+</button>
  <button data-tab="cartoes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="5.5" width="19" height="13"/><path d="M2.5 10h19M6 15h5"/></svg>Cartões</button>
  <button data-tab="futuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20h18M5 16l5-5 4 3 6-7"/><path d="M15 7h5v5"/></svg>Futuro</button>
</nav>
<div id="toast" role="status" aria-live="polite"><span></span><button id="tacao" class="hide"></button><button id="undo">desfazer</button></div>
<div id="cadeado" class="hide" role="dialog" aria-modal="true" aria-label="App trancado"></div>
<div id="backdrop"><div id="tapclose"></div><div id="sheet" role="dialog" aria-modal="true"></div></div>
<input type="file" id="i-import" accept="application/json,.json" class="hide">
<input type="file" id="i-ext" accept=".ofx,.qfx,.csv,.txt,.pdf,text/csv,application/pdf,application/x-ofx" multiple class="hide">

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   Financeiro — organização financeira pessoal (arquivo único)

   Modelo, igual ao da planilha:
   · itens recorrentes: entradas, contas (saem da conta), itens do cartão
     e o cartão da mãe (só mercado). Cada item pode ser fixo, único,
     parcelado (k/n) ou ir até um mês; o valor pode mudar só num mês
     ou daquele mês em diante. As parcelas avançam sozinhas.
   · plano do mês = entradas − contas − cartão − metas (vida diária +
     outros gastos) → quanto vai para a reserva (ou sai dela).
   · lançamentos do dia a dia, separados em três envelopes.
   Os dados ficam só neste aparelho (localStorage). Backup em Ajustes.
   Nenhum dado pessoal vem no código: entram por importação (.json ou
   link #importar=…, que não sai do aparelho).
   ════════════════════════════════════════════════════════════════════ */

const KEY = 'financeiro-rian-v2', KEY_V1 = 'financeiro-rian-v1';
let STORE_OK = true;
try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ STORE_OK = false; }

const MESES   = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_L = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DSEM    = ['dom','seg','ter','qua','qui','sex','sáb'];
const CATS = [
  {k:'comida',  n:'Comida fora', s:'CF', env:'dia'},
  {k:'mercado', n:'Mercado',     s:'MC', env:'dia'},
  {k:'role',    n:'Rolê',        s:'RL', env:'dia'},
  {k:'transp',  n:'Transporte',  s:'TR', env:'dia'},
  {k:'diaria',  n:'Dia a dia',   s:'DD', env:'dia'},
  {k:'compras', n:'Compras',     s:'CP', env:'out'},
  {k:'saude',   n:'Saúde',       s:'SA', env:'out'},
  {k:'outros',  n:'Outros',      s:'OU', env:'out'}
];
const CAT = Object.fromEntries(CATS.map(c=>[c.k,c]));
const ENV = {
  dia:{n:'Vida diária',  d:'comida fora, mercado, rolê, transporte'},
  out:{n:'Outros gastos', d:'compras, saúde, imprevistos'},
  mae:{n:'Cartão da mãe', d:'só mercado — dá pra usar tudo'}
};
const TIPOS = {entrada:'Entrada', conta:'Conta', cartao:'No cartão', mae:'Cartão da mãe'};

/* ── formatação ── */
const pad2 = n => String(n).padStart(2,'0');
const fmt  = (n,c) => Math.abs(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c});
const brl  = (n,c=2) => 'R$ ' + fmt(n,c);
const sbrl = (n,c=2) => ((+n||0) < -0.004 ? '−' : '') + brl(n,c);
const pbrl = (n,c=2) => ((+n||0) < -0.004 ? '−' : '+') + brl(n,c);
const k1   = n => { const a=Math.abs(n); return (n<0?'−':'') + (a>=1000 ? (a/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil' : Math.round(a)); };
const esc  = s => String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid  = () => Math.random().toString(36).slice(2,10);
const iso  = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const HOJE = () => iso(new Date());
const MES  = () => HOJE().slice(0,7);
const ymAdd  = (s,k) => { const [a,m]=s.split('-').map(Number); const t=a*12+(m-1)+k; return Math.floor(t/12)+'-'+pad2(t%12+1); };
const ymDiff = (a,b) => { const [y1,m1]=a.split('-').map(Number), [y2,m2]=b.split('-').map(Number); return (y1*12+m1)-(y2*12+m2); };
const ymRot  = s => MESES[+s.slice(5,7)-1]+'/'+s.slice(2,4);
const mesNome= s => MESES_L[+s.slice(5,7)-1];
const diasMes= s => new Date(+s.slice(0,4), +s.slice(5,7), 0).getDate();
const ddmm   = s => s.slice(8,10)+'/'+s.slice(5,7);
const dataD  = s => new Date(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10));
const addDia = (s,k) => { const d=dataD(s); d.setDate(d.getDate()+k); return iso(d); };
const cap    = s => s.charAt(0).toUpperCase()+s.slice(1);
function nnum(v){
  let s = String(v==null?'':v).trim().replace(/[R$\s]/g,'');
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s); return isFinite(n) ? n : 0;
}
const fmtIn = v => (+v||0).toFixed(2).replace('.',',');

/* ══════════════════ estado ══════════════════ */
function vazio(){
  return { v:2, novo:true, metas:{dia:1000, out:500}, cartao:{dia:null, fecha:null},
    reserva:{v:0, em:HOJE()}, itens:[{id:'mae', tipo:'mae', nome:'Cartão da mãe', v:0}],
    pagos:{}, lanc:[], objetivos:[], dicas:[], nudge:{}, onboard:null, ultForma:'cartao',
    cenario:{inicio:null, qtd:4, valor:1200, piso:null}, marcos:[],
    regras:{}, entr:[], vistos:{}, importacoes:[],
    nome:'', seg:{pin:null, minutos:5, discreto:false},
    revisoes:[], desejos:[], conferidas:{}, contestar:[], zipEm:null };
}
function normaliza(d){
  const b = vazio();
  d = Object.assign(b, d||{});
  d.metas  = Object.assign({dia:1000,out:500}, d.metas||{});
  d.cartao = Object.assign({dia:null, fecha:null}, d.cartao||{});
  d.reserva= Object.assign({v:0, em:HOJE()}, d.reserva||{});
  d.cenario = Object.assign({inicio:null, qtd:4, valor:1200, piso:null}, d.cenario||{});
  ['itens','lanc','objetivos','dicas','marcos','entr','importacoes'].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
  ['pagos','nudge','regras','vistos','conferidas'].forEach(k=>{ if(!d[k] || typeof d[k]!=='object' || Array.isArray(d[k])) d[k] = {}; });
  ['revisoes','desejos','contestar'].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
  d.seg = Object.assign({pin:null, minutos:5, discreto:false}, d.seg||{});
  if(!d.itens.some(i=>i.tipo==='mae')) d.itens.push({id:'mae', tipo:'mae', nome:'Cartão da mãe', v:0});
  d.itens.forEach(i=>{ if(!i.id) i.id=uid(); if(i.hist) i.hist.sort((a,b)=>a.de<b.de?-1:1); });
  d.lanc.forEach(l=>{ if(!l.id) l.id=uid(); if(!CAT[l.c]) l.c='outros'; });
  d.objetivos.forEach(o=>{ if(!o.id) o.id=uid(); if(!Array.isArray(o.itens)) o.itens=[]; });
  return d;
}

/* versão anterior do app (mesmo endereço): aproveita os lançamentos reais */
const SEED_V1 = new Set(['iFood — jantar|48.9','Uber — volta do lab|21.4','Bar com a Camila|96','Mercado — feira|132.7','Padaria|18.5',
  'Cinema|64','Almoço fora|39','Farmácia|74.3','iFood — almoço|52.6','Uber — aeroporto|88','Churrasco na casa do Léo|120',
  'Mercado — semana|180','Presente da tia|150','iFood — sushi|97.8','Boliche|70','Corte de cabelo|60']);
function lancDoV1(d){
  const cat = {Comida:'comida','Rolê':'role',Transporte:'transp','Saúde':'saude',Outros:'outros',Mercado:'mercado'};
  const fp  = {'Cartão':'cartao',Conta:'pix','Mãe':'mae'};
  return (d.lanc||[]).filter(l=>!SEED_V1.has(l.t+'|'+(+l.v)))
    .map(l=>({id:uid(), d:l.data, v:+l.v||0, c:cat[l.c]||'outros', f:fp[l.p]||'cartao', t:l.t===l.c?'':(l.t||'')}));
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d = JSON.parse(raw); if(d && d.v===2) return normaliza(d); }
    const s = vazio();
    const r1 = localStorage.getItem(KEY_V1);
    if(r1){ const v1 = JSON.parse(r1); if(v1 && Array.isArray(v1.lanc)) s.lanc = lancDoV1(v1); }
    return s;
  }catch(e){ console.warn('armazenamento indisponível', e); return vazio(); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Não deu pra salvar neste aparelho'); }
}
let S, UI = {tab:'painel', sub:'plano', mes:MES(), sheet:null, add:null, ed:null, sel:null, selF:null, aberta:null, conf:null, sim:500, imp:null};
let undoSnap = null, toastT = null;
function snap(){ undoSnap = JSON.stringify(S); }
function set(fn){ fn(S); save(); render(); }

/* ══════════════════ cálculo ══════════════════ */
const fimItem = it => it.n ? ymAdd(it.de, it.n-1) : (it.ate || null);
function ativo(it, m){
  if(it.de && m < it.de) return false;
  const f = fimItem(it); if(f && m > f) return false;
  if(it.so && it.so[m] === null) return false;
  return true;
}
function valor(it, m){
  if(it.so && it.so[m] != null) return +it.so[m];
  let v = +it.v || 0;
  (it.hist||[]).forEach(h=>{ if(h.de <= m) v = +h.v; });
  return v;
}
const parcK  = (it,m) => ymDiff(m, it.de) + 1;
const rotulo = (it,m) => it.n ? it.nome+' ('+parcK(it,m)+'/'+it.n+')' : it.nome;
const maeIt  = () => S.itens.find(i=>i.tipo==='mae');
const nomeMae= () => (maeIt()||{}).nome || 'Cartão da mãe';

const rendaPlantao = () => Math.max(0, (+S.cenario.qtd||0) * (+S.cenario.valor||0));
const comPlantao = (m, sem) => !sem && S.cenario.inicio && m >= S.cenario.inicio;
function extrasDoMes(m){
  return S.objetivos.flatMap(o=>o.itens.filter(i=>!i.ok && i.mes===m && (+i.v||0)>0).map(i=>({o, i, v:+i.v})));
}
// sem = true ignora o cenário de plantões (para comparar)
function plano(m, sem){
  const at = S.itens.filter(it=>ativo(it,m)).map(it=>({it, v:valor(it,m)}));
  const por = t => at.filter(x=>x.it.tipo===t);
  const soma = a => a.reduce((s,x)=>s+x.v,0);
  const ent = por('entrada'), contas = por('conta'), cart = por('cartao');
  const mae = soma(por('mae'));
  const tEnt = soma(ent), tContas = soma(contas), tCart = soma(cart);
  const plant = comPlantao(m, sem) ? rendaPlantao() : 0;
  const extras = extrasDoMes(m), tExtra = soma(extras);
  const entra = tEnt + plant, fixos = tContas + tCart, sobra = entra - fixos;
  const metas = (+S.metas.dia||0) + (+S.metas.out||0);
  return {m, ent, contas, cart, mae, tEnt, plant, entra, tContas, tCart, fixos, sobra, metas, extras, tExtra,
    sai: fixos + metas + tExtra, aporte: sobra - metas - tExtra};
}
const envDe = l => l.f==='mae' ? 'mae' : ((CAT[l.c]||CAT.outros).env);
function gastos(m){
  const L = S.lanc.filter(l=>l.d.slice(0,7)===m);
  const g = {dia:0, out:0, mae:0};
  L.forEach(l=>{ g[envDe(l)] += +l.v||0; });
  return {L, ...g, tot:g.dia+g.out+g.mae};
}
function hojeCalc(){
  const H = HOJE(), M = H.slice(0,7), dia = +H.slice(8,10), DM = diasMes(M);
  const g = gastos(M);
  const teto = +S.metas.dia||0;
  const gHoje = g.L.filter(l=>l.d===H && envDe(l)==='dia').reduce((s,l)=>s+(+l.v||0),0);
  const diasRest = DM - dia + 1;
  const restAntes = teto - (g.dia - gHoje);
  const ritmo = Math.max(restAntes,0) / diasRest;
  const livre = ritmo - gHoje;
  const restMes = teto - g.dia;
  const amanha = diasRest>1 ? Math.max(restMes,0)/(diasRest-1) : 0;
  return {H, M, dia, DM, g, teto, gHoje, diasRest, restAntes, ritmo, livre, restMes, amanha};
}
function semana(){
  const H = HOJE(), d0 = dataD(H), wd = (d0.getDay()+6)%7;
  const seg = addDia(H, -wd);
  const dias = Array.from({length:7},(_,i)=>{
    const d = addDia(seg,i), m = d.slice(0,7);
    const v = S.lanc.filter(l=>l.d===d && envDe(l)==='dia').reduce((s,l)=>s+(+l.v||0),0);
    return {d, v, orc:(+S.metas.dia||0)/diasMes(m)};
  });
  const cel = [0,1,2,3,4].map(i=>({n:['S','T','Q','Q','S'][i], ds:[dias[i]]})).concat([{n:'SD', ds:[dias[5],dias[6]]}])
    .map(c=>({n:c.n, v:c.ds.reduce((s,x)=>s+x.v,0), orc:c.ds.reduce((s,x)=>s+x.orc,0),
      hj:c.ds.some(x=>x.d===H), fut:c.ds.every(x=>x.d>H)}));
  return {cel, gasto:dias.reduce((s,x)=>s+x.v,0), orc:dias.reduce((s,x)=>s+x.orc,0), seg, dom:addDia(seg,6)};
}
function mesDaFatura(d){
  const m = d.slice(0,7), dia = +d.slice(8,10), fe = +S.cartao.fecha||0, ve = +S.cartao.dia||0;
  if(!fe) return m;
  const fecha = dia < fe ? m : ymAdd(m,1);
  return ve && ve > fe ? fecha : ymAdd(fecha,1);
}
const lancFatura = m => S.lanc.filter(l=>l.f==='cartao' && mesDaFatura(l.d)===m);
function contasDoMes(m){
  const P = plano(m), pg = S.pagos[m]||{};
  const tL = lancFatura(m).reduce((s,l)=>s+(+l.v||0),0);
  const L = P.contas.map(x=>({id:x.it.id, it:x.it, nome:rotulo(x.it,m), v:x.v, dia:+x.it.dia||null, auto:!!x.it.auto, pago:pg[x.it.id]||null}));
  if(P.tCart+tL>0) L.push({id:'fatura', nome:'Fatura do cartão', v:P.tCart+tL, dia:+S.cartao.dia||null, auto:false, pago:pg.fatura||null, fatura:true});
  return L;
}
function status(c, m){
  const H = HOJE(), M = H.slice(0,7);
  if(c.pago) return {k:'pago', t: c.pago===true ? 'pago' : 'pago '+ddmm(c.pago)};
  if(c.auto) return {k:'auto', t:'débito automático'};
  if(m < M)  return {k:'sem', t:'não marcada'};
  if(!c.dia) return {k:'sem', t:'sem dia certo'};
  const d = Math.min(c.dia, diasMes(m));
  if(m > M)  return {k:'fut', t:'dia '+d};
  const hj = +H.slice(8,10);
  if(d < hj)  return {k:'atras', t:'venceu dia '+d};
  if(d === hj) return {k:'hoje', t:'vence hoje'};
  if(d === hj+1) return {k:'logo', t:'vence amanhã'};
  return {k:(d-hj<=5?'logo':'fut'), t:'dia '+d+' · em '+(d-hj)+' dias'};
}
const resolvida = (c,m) => { const k = status(c,m).k; return k==='pago' || k==='auto'; };

/* reserva: valor informado + plano dos meses desde então */
function aporteMes(m, sem){
  // meses futuros: o plano. Mês atual e passados: o plano, a não ser que os gastos já passem das metas
  const P = plano(m, sem);
  if(m > MES()) return P.aporte;
  const g = gastos(m);
  return P.sobra - Math.max(g.dia, +S.metas.dia||0) - Math.max(g.out, +S.metas.out||0) - P.tExtra;
}
function reservaInicio(sem){
  const M = MES(); let r = +S.reserva.v||0, m = S.reserva.em.slice(0,7);
  while(m < M){ r += aporteMes(m, sem); m = ymAdd(m,1); }
  return r;
}
// reserva no FIM de cada mês, a partir do atual
function projecao(n, sem){
  let r = reservaInicio(sem); const M = MES(), out = [];
  for(let i=0;i<n;i++){ const m = ymAdd(M,i), P = plano(m, sem), ap = aporteMes(m, sem); r += ap; out.push({m, P, ap, r}); }
  return out;
}
function duraAte(sem){
  let r = reservaInicio(sem); const M = MES();
  for(let i=0;i<360;i++){ const m = ymAdd(M,i); r += aporteMes(m, sem); if(r < 0) return m; }
  return null;
}
function pisoSugerido(){
  const M = MES(); let t = 0;
  for(let i=1;i<=6;i++) t += plano(ymAdd(M,i)).tContas;
  return Math.round(t/6*6/500)*500;   // 6 meses das contas fixas
}
function mudancas(){
  const M = MES(), lim = ymAdd(M,18), ev = [];
  S.itens.forEach(it=>{
    if(it.tipo==='mae') return;
    const sinal = it.tipo==='entrada' ? 1 : -1, f = fimItem(it);
    const unico = !it.n && it.de && f===it.de;
    if(unico && it.de > M){ if(it.de <= lim) ev.push({m:it.de, nome:it.nome, d:sinal*valor(it,it.de), t:'só em '+ymRot(it.de), u:true}); return; }
    if(f){
      const m = ymAdd(f,1);
      if(m > M && m <= lim) ev.push({m, nome:it.nome, d:-sinal*valor(it,f),
        t: unico ? 'foi só em '+ymRot(f) : it.tipo==='entrada' ? 'para de entrar' : it.n ? 'acabam as parcelas' : 'termina'});
    }
    if(it.de && it.de > M && it.de <= lim)
      ev.push({m:it.de, nome:it.nome, d:sinal*valor(it,it.de), t: it.tipo==='entrada' ? 'começa a entrar' : it.n ? 'começa ('+it.n+'x)' : 'começa'});
  });
  const C = S.cenario;
  if(C.inicio && C.inicio > M && C.inicio <= lim && rendaPlantao()>0)
    ev.push({m:C.inicio, nome:'Plantões', d:rendaPlantao(), t:'começam a pagar (previsão)', plant:true});
  S.objetivos.forEach(o=>o.itens.forEach(i=>{
    if(!i.ok && i.mes && i.mes >= M && i.mes <= lim && (+i.v||0)>0) ev.push({m:i.mes, nome:o.nome+': '+i.n, d:-(+i.v), t:'só em '+ymRot(i.mes), u:true});
  }));
  return ev.filter(e=>Math.abs(e.d)>0.004 && (e.m > M || (e.u && e.m===M))).sort((a,b)=>a.m<b.m?-1:a.m>b.m?1:Math.abs(b.d)-Math.abs(a.d));
}

/* ══════════════════ render ══════════════════ */
const CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const GEAR  = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>';

function render(){ renderView(); renderSheet(); atualizaSemComp(); }
function renderView(){
  document.body.classList.toggle('discreto', !!S.seg.discreto);
  const av = document.getElementById('aviso');
  av.classList.toggle('hide', STORE_OK);
  if(!STORE_OK) av.textContent = 'Este navegador não está deixando guardar dados (aba anônima?). O que você lançar some ao fechar.';
  document.getElementById('topo').innerHTML = vTopo();
  const v = document.getElementById('view');
  v.innerHTML = UI.tab==='painel' ? vPainel() : UI.tab==='mes' ? vMes() : UI.tab==='cartoes' ? vCartoes() : vFuturo();
  document.querySelectorAll('#nav button[data-tab]').forEach(b=>b.classList.toggle('on', b.dataset.tab===UI.tab));
}

function vTopo(){
  const H = HOJE(), d = dataD(H);
  const sw = `<div class="mswitch"><button data-act="mes" data-v="-1" aria-label="Mês anterior">‹</button>
    <span>${ymRot(UI.mes)}</span><button data-act="mes" data-v="1" aria-label="Próximo mês">›</button></div>`;
  const tit = {painel: S.nome ? 'Oi, '+esc(S.nome) : 'Painel', mes:'Mês', cartoes:'Cartões', futuro:'Futuro'}[UI.tab];
  const sub = UI.tab==='painel' ? `${DSEM[d.getDay()]}, ${d.getDate()} de ${mesNome(H)}`
    : UI.tab==='futuro' ? 'reserva e próximos meses'
    : UI.tab==='cartoes' ? 'fatura que vence em '+mesNome(UI.mes)
    : (UI.mes===MES() ? 'mês atual' : UI.mes < MES() ? 'mês que passou' : ymDiff(UI.mes,MES())===1 ? 'mês que vem' : 'previsão');
  return `<h1>${tit}<span class="sub">${esc(sub)}</span></h1>

/* ══════════════════ cadeado (PIN) e modo discreto ══════════════════
   O PIN não fica salvo: só um hash PBKDF2 (com sal) dele. É um cadeado de
   privacidade para quem pegar o celular desbloqueado, não criptografia. */
const hexDe = buf => [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
async function hashPin(pin, sal){
  const enc = new TextEncoder();
  const k = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']);
  return hexDe(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:enc.encode(sal), iterations:150000}, k, 256));
}
const CAD = {travado:false, digitado:'', erros:0, esperaAte:0, fora:null, msg:'', esqueci:false};
const temPin = () => !!(S.seg.pin && S.seg.pin.hash && window.crypto && crypto.subtle);
function travar(){ if(!temPin()) return; Object.assign(CAD, {travado:true, digitado:'', msg:'', esqueci:false}); renderCadeado(); }
function renderCadeado(){
  const el = document.getElementById('cadeado'), shell = document.getElementById('shell');
  if(!CAD.travado){ el.classList.add('hide'); el.innerHTML = ''; shell.removeAttribute('aria-hidden'); return; }
  shell.setAttribute('aria-hidden','true'); el.classList.remove('hide');
  const n = S.seg.pin.n || 4;
  el.innerHTML = `<div class="cad">
    <div class="big" style="font-size:30px">${S.nome ? 'Oi, '+esc(S.nome) : 'Financeiro'}</div>
    <div class="small mut2" style="margin-top:4px">Digite seu PIN</div>
    <div class="pontos${CAD.msg?' treme':''}" aria-live="polite" aria-label="${CAD.digitado.length} de ${n} dígitos">${Array.from({length:n},(_,i)=>`<i class="${i<CAD.digitado.length?'on':''}"></i>`).join('')}</div>
    <div class="small warn" style="min-height:22px">${esc(CAD.msg)}</div>
    <div class="keys" style="width:100%;max-width:300px">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(t=>t?`<button data-act="pin-tecla" data-v="${t}" aria-label="${t==='⌫'?'apagar':t}">${t}</button>`:'<span></span>').join('')}</div>
    <button class="limpo lnk" data-act="pin-esqueci" style="margin-top:18px">esqueci o PIN</button>
    ${CAD.esqueci?`<div class="nota" style="margin-top:12px;text-align:left">${S.seg.pin.dica?`<div style="margin-bottom:6px">Sua dica: <b>${esc(S.seg.pin.dica)}</b></div>`:''}
      <div class="small mut2">Sem o PIN, o jeito é apagar os dados deste aparelho e importar o último backup (.json).</div>
      <button class="btn sm blk dng" data-act="pin-apagar" style="margin-top:10px">Apagar os dados deste aparelho</button></div>`:''}
  </div>`;
}
async function teclaPin(t){
  if(Date.now() < CAD.esperaAte){ CAD.msg = 'Espere alguns segundos e tente de novo.'; renderCadeado(); return; }
  const n = S.seg.pin.n || 4;
  if(t==='⌫') CAD.digitado = CAD.digitado.slice(0,-1);
  else if(/^\d$/.test(t) && CAD.digitado.length < n) CAD.digitado += t;
  CAD.msg = '';
  if(CAD.digitado.length === n){
    const ok = (await hashPin(CAD.digitado, S.seg.pin.sal)) === S.seg.pin.hash;
    if(ok){ Object.assign(CAD, {travado:false, digitado:'', erros:0}); renderCadeado(); render(); return; }
    CAD.erros++; CAD.digitado = '';
    if(CAD.erros >= 5){ CAD.esperaAte = Date.now() + 30000; CAD.erros = 0; CAD.msg = 'Muitas tentativas. Espere 30 segundos.'; }
    else CAD.msg = 'PIN errado.';
    if(navigator.vibrate) try{ navigator.vibrate([40,40,40]); }catch(_){}
  }
  renderCadeado();
}

/* ══════════════════ “Agora”: só o próximo passo ══════════════════
   Pensado para TDAH: no topo do painel, no máximo 3 coisas, cada uma com
   um botão que resolve. O resto do painel é contexto. */
function agoraItens(){
  const H = HOJE(), M = MES(), hj = +H.slice(8,10), it = [];
  const cs = contasDoMes(M);
  cs.filter(c=>!resolvida(c,M) && c.dia).forEach(c=>{
    const d = Math.min(c.dia, diasMes(M)) - hj;
    if(d <= 3) it.push({p: d < 0 ? 0 : 1 + d, alerta: d <= 0, t:c.nome, v:c.v,
      sub: d < 0 ? 'venceu dia '+c.dia : d===0 ? 'vence hoje' : d===1 ? 'vence amanhã' : 'vence em '+d+' dias',
      bt:'Paguei', attr:`data-act="pagar" data-id="${c.id}" data-m="${M}"`});
  });
  S.desejos.filter(d=>!d.fim && Date.now() - d.em >= 48*3600e3).forEach(d=>it.push({p:4, t:'Ainda quer '+d.n+'?', v:d.v,
    sub:'já esperou '+Math.floor((Date.now()-d.em)/3600e3)+' h', bt:'Decidir', attr:`data-act="desejo" data-id="${d.id}"`}));
  const fat = cs.find(c=>c.fatura);
  if(fat && !S.conferidas[M] && window.Conferencia) it.push({p:5, t:'Conferir a fatura de '+mesNome(M),
    sub:'o app checa cada cobrança com você', bt:'Conferir', attr:'data-act="conf"'});
  if(UI.semComp && UI.semComp.n) it.push({p:6, t:UI.semComp.n+(UI.semComp.n>1?' contas pagas':' conta paga')+' sem comprovante',
    sub:'guarde agora: leva 10 segundos cada', bt:'Guardar', attr:'data-act="comp"'});
  const ult = S.revisoes[S.revisoes.length-1];
  if(!ult || diasEntre(H, ult) >= 7) it.push({p:7, t:'Revisão de 5 minutos', sub: ult ? 'a última foi há '+diasEntre(H, ult)+' dias' : 'um passo de cada vez',
    bt:'Começar', attr:'data-act="rev"'});
  if(S.importacoes.length && window.Comprovantes){
    const z = S.zipEm ? diasEntre(H, S.zipEm) : 999;
    if(z >= 30 && UI.compUso && UI.compUso.n) it.push({p:8, t:'Backup dos comprovantes', sub:'estão só neste celular', bt:'Baixar', attr:'data-act="comp-zip"'});
  }

    it.push({p:9, t:'Lembretes no calendário', sub:'o celular avisa antes de cada conta vencer', bt:'Criar', attr:'data-act="agenda"'});
  return it.sort((a,b)=>a.p-b.p);
}

// semanas seguidas com revisão (a semana atual conta se já foi feita; senão começa pela passada)
function semanaDe(d){ const x = dataD(d); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return iso(x); }
function sequencia(){
  const sem = new Set(S.revisoes.map(semanaDe));
  let w = semanaDe(HOJE()), n = 0;
  if(!sem.has(w)) w = addDia(w,-7);
  while(sem.has(w)){ n++; w = addDia(w,-7); }
  return n;
}

    out.push(`<div class="card">
      <div class="lbl">livre para aproveitar até ${ymRot(alvo.m)}</div>
      ${folga > 0 ? `<div class="big ok" style="font-size:40px;margin:4px 0 4px">${brl(folga,0)}</div>
        <div class="small mut2">Além do que já está no plano (as metas de vida diária e outros gastos, ${brl(+S.metas.dia+(+S.metas.out),0)}/mês, já contam). Dá uns <b>${brl(folga/3,0)} por mês</b> sem passar do piso.</div>
        ${mediaDepois < -1 ? `<div class="tiny mut" style="margin-top:6px">Depois de ${ymRot(alvo.m)} a reserva ainda cai ~${brl(-mediaDepois,0)}/mês nesse cenário${C.inicio?'':' até os plantões começarem'}.</div>`:''}`
      : `<div class="big warn" style="font-size:32px;margin:4px 0 4px">R$ 0</div>
        <div class="small mut2">Nesse cenário não sobra nada acima do piso até ${ymRot(alvo.m)}. O que mais muda o quadro é quando entra o primeiro plantão — e as metas mensais (em Ajustes).</div>`}
    </div>`);
  } else {
    const sug = pisoSugerido();
    out.push(`<div class="nota">
      <div style="font-weight:600;margin-bottom:2px">Qual o piso da sua reserva?</div>
      <div class="small mut2" style="margin-bottom:10px">É o valor que fica guardado pra emergência, aconteça o que acontecer. O que passar disso é seu pra aproveitar.${sug?` Uma referência comum: 6 meses das contas fixas ≈ <b>${brl(sug,0)}</b>.`:''}</div>
      <div class="btns">${sug?`<button class="btn sm" data-act="piso" data-v="${sug}">Usar ${k1(sug)}</button>`:''}<button class="btn sm pri" data-act="cen">Definir piso</button></div>
    </div>`);
  }

  // 3. quando entra dinheiro de plantão
  const opcoes = Array.from({length:6},(_,i)=>ymAdd(M,i+1));
  const semP = projecao(4, true), custo = semP.slice(1).reduce((s,p)=>s+p.ap,0)/3;
  const volta = C.inicio ? projecao(18).find(p=>p.m>=C.inicio && p.ap>0) : null;
  const mk = proxMarco();
  out.push(`<div class="card">
    <div class="hd"><span class="lbl">quando cai o 1º dinheiro de plantão?</span><button class="lnk" data-act="cen">ajustar</button></div>
    <div class="chips">${opcoes.map(m=>`<button class="chip${C.inicio===m?' on':''}" data-act="inicio" data-v="${m}">${MESES[+m.slice(5)-1]}</button>`).join('')}
      <button class="chip${!C.inicio?' on':''}" data-act="inicio" data-v="">não sei</button></div>
    <div class="small mut2" style="margin-top:10px;line-height:1.5">
      ${C.inicio ? `${brl(rendaPlantao(),0)}/mês a partir de ${mesNome(C.inicio)} (${C.qtd} plantões × ${brl(C.valor,0)}, líquido).${volta?` A reserva volta a crescer em <b>${ymRot(volta.m)}</b>.`:''}`
        : 'Sem plantão na conta por enquanto. Escolha um mês pra ver o efeito na reserva.'}
      ${custo < -1 ? ` Cada mês sem plantão tira uns <b>${brl(-custo,0)}</b> da reserva.`:''}</div>
    ${mk?`<div class="tiny mut" style="margin-top:8px">${esc(mk.t)}: ${ddmm(mk.d)} · ${diasAte(mk.d)===0?'é hoje':diasAte(mk.d)===1?'amanhã':'faltam '+diasAte(mk.d)+' dias'}</div>`:''}
  </div>`);

  // 4. mês a mês: este e os próximos 3
  const ev = mudancas();
  out.push(`<div class="card flush">
    <div class="hd" style="padding:14px 16px 0;margin-bottom:4px"><span class="lbl">mês a mês</span><button class="lnk" data-act="ir" data-v="futuro">12 meses ›</button></div>
    <div class="rows">${PJ.map((p,i)=>{
      const E = ev.filter(e=>e.m===p.m).slice(0,3);
      const mks = S.marcos.filter(x=>x.d.slice(0,7)===p.m);
      return `<button class="r" data-act="ver-mes" data-v="${p.m}" style="flex-direction:column;align-items:stretch;gap:3px">
        <span style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
          <b style="font-weight:600">${cap(mesNome(p.m))}${i===0?' <span class="tiny mut" style="font-weight:400">agora</span>':''}</b>
          <span class="num ${p.ap<0?'warn':'ok'}" style="font-size:17px">${pbrl(p.ap,0)}</span></span>
        <span class="tiny mut">entra ${brl(p.P.entra,0)} · sai ${brl(p.P.sai,0)} · reserva ${sbrl(p.r,0)}</span>
        ${E.concat(mks.map(x=>({nome:x.t, t:ddmm(x.d), d:0, marco:true}))).map(e=>`<span class="tiny mut2">· ${esc(e.nome)} — ${esc(e.t)}${e.marco?'':' <span class="num">'+pbrl(e.d,0)+'</span>'}</span>`).join('')}
      </button>`;}).join('')}</div>
  </div>`);

  // 5. hoje
  const W = semana(), estourou = K.restAntes <= 0;
  out.push(`<div class="card" style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px">
    <div><div class="lbl">${estourou?'vida diária':'pode gastar hoje'}</div>
      <div class="big" style="font-size:36px;margin-top:2px">${estourou?'R$ 0':brl(Math.max(K.livre,0))}</div>
      <div class="tiny mut">${estourou?`passou ${brl(-K.restMes,0)} do teto do mês`:K.livre<0?`passou ${brl(-K.livre)} do ritmo hoje`:`resta ${brl(K.restMes,0)} até ${diasMes(M)}/${M.slice(5)}`}</div></div>
    <div style="text-align:right"><div class="lbl">semana</div>
      <div class="num" style="font-size:20px">${brl(W.gasto,0)}</div><div class="tiny mut">de ~${brl(W.orc,0)}</div></div>
  </div>`);

  // 6. envelopes do mês
  const maeV = plano(M).mae;
  const envs = [['dia', K.teto, K.g.dia], ['out', +S.metas.out||0, K.g.out]];
  if(maeV>0) envs.push(['mae', maeV, K.g.mae]);
  out.push(`<div class="card">
    <div class="hd"><span class="lbl">envelopes de ${mesNome(M)}</span><button class="lnk" data-act="tab" data-v="mes" data-sub="gastos">gastos ›</button></div>
    <div style="display:flex;flex-direction:column;gap:12px">${envs.map(([k,teto,us])=>{
      const resta = teto-us, pct = teto>0 ? Math.min(us/teto,1)*100 : (us>0?100:0);
      return `<div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
          <span style="font-weight:500">${esc(k==='mae'?nomeMae():ENV[k].n)}</span>
          <span class="num" style="font-size:16px">${resta<0?`<span class="warn">passou ${brl(-resta,0)}</span>`:'resta '+brl(resta,0)}</span></div>
        <div class="meter${resta<0?' over':''}" style="margin:5px 0 3px"><i style="width:${pct.toFixed(1)}%"></i></div>
        <div class="tiny mut" style="text-align:right">${brl(us,0)} de ${brl(teto,0)}</div>
      </div>`;}).join('')}</div>
  </div>`);

  // 7. para onde foi o dinheiro + extrato
  const g = gastos(M);
  const pc = CATS.map(c=>({c, v:g.L.filter(l=>l.c===c.k).reduce((s,l)=>s+(+l.v||0),0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,4);
  const ult = S.importacoes[S.importacoes.length-1];
  out.push(`<div class="card">
    <div class="hd"><span class="lbl">para onde foi o dinheiro em ${mesNome(M)}</span>${pc.length?'<button class="lnk" data-act="tab" data-v="mes" data-sub="gastos">detalhes ›</button>':''}</div>
    ${pc.length?`<div class="hb" style="margin-bottom:12px">${pc.map(x=>`<span class="t">${esc(x.c.n)}</span>
      <span class="b"><i style="width:${(x.v/pc[0].v*100).toFixed(1)}%"></i></span><span class="v">${brl(x.v,0)}</span>`).join('')}</div>`:''}
    <div class="small mut2" style="margin-bottom:10px">${ult?`Último extrato: ${esc(ult.banco||ult.nome)} em ${ddmm(ult.em)} (${ult.n} itens).`:'Importe o extrato da conta e a fatura do cartão: o app separa os gastos sozinho, marca as contas pagas e aprende com as suas correções.'}</div>
    <button class="btn blk${ult?'':' pri'}" data-act="ext">Importar extrato do banco</button>
  </div>`);

  // 8. contas a pagar
  const cs = contasDoMes(M);
  const abertas = cs.filter(c=>!resolvida(c,M)).sort((a,b)=>(a.dia||99)-(b.dia||99));
  out.push(`<div class="card flush">
    <div class="hd" style="padding:14px 16px 0;margin-bottom:4px"><span class="lbl">contas a pagar</span>
      <button class="lnk" data-act="tab" data-v="mes">${cs.length-abertas.length} de ${cs.length} ok ›</button></div>
    ${abertas.length ? `<div class="rows">${abertas.slice(0,3).map(c=>linhaConta(c,M)).join('')}</div>
      <div class="tot"><span class="small mut2">${abertas.length>3?`e mais ${abertas.length-3} · `:''}faltam pagar</span><span class="num" style="font-size:18px">${brl(abertas.reduce((s,c)=>s+c.v,0))}</span></div>`
    : `<div class="empty">${cs.length?'Tudo pago em '+mesNome(M)+'. ✓':'Nenhuma conta cadastrada. Adicione na aba Mês.'}</div>`}
  </div>`);

  // 9. cartão
  const fat = cs.find(c=>c.fatura);
  const parcs = S.itens.filter(it=>it.n && it.tipo!=='entrada' && fimItem(it) >= M);
  const deve = parcs.reduce((s,it)=>s+faltaParc(it,M),0);
  const prox = parcs.filter(it=>ativo(it,M)).sort((a,b)=>fimItem(a)<fimItem(b)?-1:1)[0];
  out.push(`<button class="card" data-act="ir" data-v="cartoes" style="width:100%;text-align:left">
    <div class="hd"><span class="lbl">cartão</span><span class="lnk">ver ›</span></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <span>Fatura de ${mesNome(M)}</span><span class="num" style="font-size:19px">${brl(fat?fat.v:0,0)}</span></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px">
      <span>Ainda falta em parcelas</span><span class="num" style="font-size:19px">${brl(deve,0)}</span></div>
    ${prox?`<div class="tiny mut" style="margin-top:6px">Próxima a acabar: ${esc(prox.nome)} (${ymRot(fimItem(prox))}), libera ${brl(valor(prox,M),0)}/mês.</div>`:''}
  </button>`);

  // 10. objetivos
  S.objetivos.forEach(o=>{
    const falta = o.itens.filter(i=>!i.ok).reduce((s,i)=>s+(+i.v||0),0); if(falta<=0) return;
    const semData = o.itens.filter(i=>!i.ok && !i.mes).length;
    out.push(`<button class="card" data-act="ed-obj" data-id="${o.id}" style="width:100%;text-align:left">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><b style="font-weight:600">${esc(o.nome)}</b><span class="num" style="font-size:18px">faltam ${brl(falta,0)}</span></div>
      <div class="tiny mut" style="margin-top:4px">${semData?`${semData} ${semData>1?'itens':'item'} sem data — diga o mês de pagar pra entrar na previsão.`:o.itens.filter(i=>!i.ok).map(i=>esc(i.n)+' em '+ymRot(i.mes)).join(' · ')}</div>
    </button>`);
  });

  // 11. últimos gastos
  const rec = S.lanc.slice().sort(ordLanc).slice(0,3);
  if(rec.length) out.push(`<div class="card flush">
    <div class="hd" style="padding:14px 16px 0;margin-bottom:4px"><span class="lbl">últimos gastos</span>
      <button class="lnk" data-act="tab" data-v="mes" data-sub="gastos">ver todos ›</button></div>
    <div class="rows">${rec.map(l=>linhaLanc(l)).join('')}</div>
  </div>`);

  // 12. lembrete (as suas dicas)
  if(S.dicas.length){
    const i = Math.floor((dataD(K.H) - new Date(dataD(K.H).getFullYear(),0,0))/864e5) % S.dicas.length;
    const dc = S.dicas[i];
    out.push(`<button class="dica card" data-act="dica" data-v="${i}">
      <div class="lbl" style="margin-bottom:3px">lembrete</div>
      <div style="font-weight:600">${esc(dc.t)}</div>
      ${UI.aberta==='dica'+i?`<div class="small mut2" style="margin-top:4px">${esc(dc.x)}</div>`:'<div class="tiny mut" style="margin-top:2px">tocar para ler</div>'}
    </button>`);
  }
  return out.join('');
}

function vBoasVindas(){
  const temV1 = S.lanc.length;
  return `<div class="card hero" style="padding:20px 18px">
    <div class="big" style="font-size:30px;margin-bottom:8px">Oi! Vamos organizar.</div>
    <div class="small" style="line-height:1.55">Este app faz o que a sua planilha fazia, sem copiar aba todo mês: as parcelas avançam sozinhas, as contas viram uma lista pra marcar como pagas, e a tela de hoje diz quanto dá pra gastar.</div>
  </div>
  <div class="card">
    <div style="font-weight:600;margin-bottom:4px">Já tem seus dados num arquivo?</div>
    <div class="small mut2" style="margin-bottom:12px">Se você recebeu o arquivo <b>.json</b> (ou um link de importação), é só abrir aqui. Fica tudo só neste aparelho.</div>
    <button class="btn pri blk" data-act="importar">Importar meus dados</button>
    <button class="btn blk" data-act="zero" style="margin-top:8px">Começar do zero</button>
    ${temV1?`<div class="tiny mut" style="margin-top:10px">Achei ${temV1} lançamento${temV1>1?'s':''} da versão antiga do app. Eles continuam aqui.</div>`:''}
  </div>`;
}

const ordLanc = (a,b) => a.d<b.d?1:a.d>b.d?-1:0;
function linhaLanc(l, semData){
  const c = CAT[l.c]||CAT.outros, e = envDe(l);
  const forma = l.f==='mae' ? nomeMae() : l.f==='pix' ? 'Pix/débito' : 'cartão';
  return `<button class="r" data-act="ed-lanc" data-id="${l.id}">
    <span class="sig ${e}">${c.s}</span>
    <span class="tx"><b>${esc(l.t||c.n)}</b><span>${semData?'':ddmm(l.d)+' · '}${esc(l.t?c.n+' · ':'')}${esc(forma)}</span></span>
    <span class="v${l.v<0?' ok':''}">${l.v<0?'+':''}${brl(l.v)}</span></button>`;
}
function linhaConta(c, m){
  const st = status(c, m);
  const pill = st.k==='atras' ? 'warn' : st.k==='hoje'||st.k==='logo' ? 'acc' : st.k==='pago' ? 'ok' : '';
  return `<div class="r">
    <button class="chk${st.k==='pago'?' on':''}${st.k==='auto'?' auto':''}" data-act="pagar" data-id="${c.id}" data-m="${m}" aria-label="${st.k==='pago'?'Desmarcar':'Marcar como paga'}: ${esc(c.nome)}">${CHECK}</button>
    ${c.fatura?'<span class="tx">':`<button class="tx" data-act="ed-item" data-id="${c.id}" data-m="${m}" style="background:none;border:0;padding:0;text-align:left">`}
      <b>${esc(c.nome)}</b><span><span class="pill ${pill}">${esc(st.t)}</span>${temComp(c.id,m)?' <span class="tiny ok" title="comprovante guardado">📎</span>':''}</span>${c.fatura?'</span>':'</button>'}
    <span class="v"${st.k==='pago'||st.k==='auto'?' style="color:var(--mut)"':''}>${brl(c.v)}</span></div>`;
}

/* ─────────── GASTOS ─────────── */
function vGastos(){
  const m = UI.mes, g = gastos(m), out = [];
  const maeV = plano(m).mae;
  const tiles = [['dia',g.dia,+S.metas.dia||0],['out',g.out,+S.metas.out||0]];
  if(maeV>0 || g.mae>0) tiles.push(['mae',g.mae,maeV]);
  out.push(`<div class="card">
    <div class="lbl">gasto em ${mesNome(m)}</div>
    <div class="big" style="font-size:48px;margin:2px 0 12px;font-variant-numeric:normal">${brl(g.tot,0)}</div>
    <div style="display:grid;grid-template-columns:repeat(${tiles.length},1fr);gap:10px">${tiles.map(([k,v,t])=>`<div>
      <div class="tiny mut2" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(k==='mae'?nomeMae():ENV[k].n)}</div>
      <div class="num" style="font-size:19px">${brl(v,0)}</div>
      <div class="tiny ${v>t&&t>0?'warn':'mut'}">de ${brl(t,0)}</div></div>`).join('')}</div>
  </div>`);

  out.push(`<button class="btn blk" data-act="ext">Importar extrato do banco</button>`);
  if(!g.L.length){
    out.push(`<div class="card empty" style="padding:18px 16px">Nenhum gasto em ${mesNome(m)} ainda. Lance pelo + ou importe o extrato.</div>`);
    return out.join('');
  }
  const ant = gastos(ymAdd(m,-1));
  if(ant.L.length) out.push(`<div class="tiny mut" style="margin-top:-8px">${cap(mesNome(ymAdd(m,-1)))}: ${brl(ant.tot,0)} no total.</div>`);
  // por categoria
  const gA = gastos(ymAdd(m,-1)), soma = (L,k) => L.filter(l=>l.c===k).reduce((s,l)=>s+(+l.v||0),0);
  const pc = CATS.map(c=>({c, v:soma(g.L,c.k), a:soma(gA.L,c.k)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const mx = Math.max(...pc.map(x=>x.v),1);
  out.push(`<div class="card">
    <div class="hd"><span class="lbl">por categoria</span>${gA.L.length?`<span class="tiny mut">vs ${ymRot(ymAdd(m,-1))}</span>`:''}</div>
    <div class="hb">${pc.map(x=>`<span class="t">${esc(x.c.n)}</span>
      <span class="b" title="${esc(x.c.n)}: ${brl(x.v)}"><i style="width:${(x.v/mx*100).toFixed(1)}%"></i></span>
      <span class="v">${brl(x.v,0)}${gA.L.length?`<span class="tiny ${x.v-x.a>1?'warn':'mut'}" style="display:block;line-height:1.1">${x.v-x.a>1?'+':x.v-x.a<-1?'−':''}${Math.abs(x.v-x.a)>1?brl(Math.abs(x.v-x.a),0):'igual'}</span>`:''}</span>`).join('')}</div>
  </div>`);
  // onde mais gastou (estabelecimentos), assinaturas e o que entrou de verdade
  const grupos = {};
  g.L.filter(l=>l.v>0 && envDe(l)!=='mae').forEach(l=>{
    const k = l.k || normTxt(l.t) || l.c;
    const x = grupos[k] || (grupos[k] = {n:l.t || CAT[l.c].n, v:0, q:0});
    x.v += +l.v; x.q++;
  });
  const top = Object.values(grupos).sort((a,b)=>b.v-a.v).slice(0,6);
  if(top.length > 1) out.push(`<div class="card flush">
    <div class="hd" style="padding:14px 16px 0;margin-bottom:4px"><span class="lbl">onde mais gastou</span></div>
    <div class="rows">${top.map(x=>`<div class="r" style="min-height:0;padding:9px 16px"><span class="tx"><b>${esc(x.n)}</b><span>${x.q} ${x.q>1?'vezes':'vez'}</span></span><span class="v" style="font-size:16px">${brl(x.v,0)}</span></div>`).join('')}</div>
  </div>`);
  const ass = g.L.filter(l=>l.a);
  if(ass.length) out.push(`<div class="nota"><b>Assinaturas no extrato:</b> ${ass.map(l=>esc(l.t)+' '+brl(l.v,0)).join(' · ')}. Se alguma é fixa, vale pôr no cartão (aba Cartões) e deixar de contar nos envelopes.</div>`);
  const E = S.entr.filter(e=>e.d.slice(0,7)===m);
  if(E.length) out.push(`<div class="card">
    <div class="hd"><span class="lbl">entrou de verdade em ${mesNome(m)}</span><span class="num" style="font-size:17px">${brl(E.reduce((s,e)=>s+e.v,0),0)}</span></div>
    <div class="tiny mut">No plano: ${brl(plano(m).entra,0)}. ${E.slice().sort((a,b)=>b.v-a.v).slice(0,4).map(e=>esc(e.t)+' '+brl(e.v,0)).join(' · ')}</div>
  </div>`);
  // lista por dia
  const dias = [...new Set(g.L.map(l=>l.d))].sort().reverse();
  out.push(`<div class="card flush">${dias.map(d=>{
    const L = g.L.filter(l=>l.d===d), dd = dataD(d);
    return `<div class="dh">
      <span class="lbl">${DSEM[dd.getDay()]}, ${ddmm(d)}</span><span class="num mut">${brl(L.reduce((s,l)=>s+(+l.v||0),0))}</span></div>
      <div class="rows">${L.map(l=>linhaLanc(l,true)).join('')}</div>`;}).join('')}</div>`);
  return out.join('');
}

/* ─────────── MÊS ─────────── */
function vMes(){
  const seg = `<div class="seg" role="tablist">
    <button class="${UI.sub!=='gastos'?'on':''}" data-act="sub" data-v="plano" role="tab">Plano e contas</button>
    <button class="${UI.sub==='gastos'?'on':''}" data-act="sub" data-v="gastos" role="tab">Gastos</button></div>`;
  return seg + (UI.sub==='gastos' ? vGastos() : vPlano());
}
function vPlano(){
  const m = UI.mes, P = plano(m), out = [];
  const cs = contasDoMes(m);
  const ok = cs.filter(c=>resolvida(c,m));
  const linha = (t,v,cls='',sinal='') => `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0">
    <span class="${cls}">${t}</span><span class="num" style="font-size:17px">${sinal}${brl(v)}</span></div>`;

  out.push(`<div class="card">
    <div class="lbl" style="margin-bottom:6px">plano de ${mesNome(m)}</div>

function linhaItem(x, m){
  const it = x.it, sub = [];
  if(it.tipo==='entrada' && it.dia) sub.push('cai dia '+it.dia);
  if(it.tipo==='conta' && it.dia) sub.push('vence dia '+it.dia);
  if(it.auto) sub.push('automático');
  const f = fimItem(it);
  if(it.n) sub.push(f===m ? 'última parcela' : 'até '+ymRot(f));
  else if(f) sub.push(f===m && it.de===m ? 'só este mês' : 'até '+ymRot(f));
  if(it.tipo==='mae') sub.push('só mercado, fora da reserva');
  if(it.so && it.so[m]!=null) sub.push('valor só deste mês');
  return `<button class="r" data-act="ed-item" data-id="${it.id}" data-m="${m}">
    <span class="tx"><b>${esc(rotulo(it,m))}</b><span>${esc(sub.join(' · ')||' ')}</span></span>
    <span class="v">${brl(x.v)}</span></button>`;
}

/* ─────────── CARTÕES ─────────── */
function segs(k, n){
  if(n > 24) return `<div class="meter"><i style="width:${(k/n*100).toFixed(1)}%"></i></div>`;
  return `<div class="pseg">${Array.from({length:n},(_,i)=>`<i class="${i<k-1?'pg':i===k-1?'at':''}"></i>`).join('')}</div>`;
}
function faltaParc(it, m){            // parcelas de m até a última (inclusive)
  let t = 0; const f = fimItem(it);
  for(let x = it.de > m ? it.de : m; x <= f; x = ymAdd(x,1)) if(ativo(it,x)) t += valor(it,x);
  return t;
}

function frasePrazo(ate, M){
  const n = ymDiff(ate, M);
  return n<=12 ? 'acaba em '+ymRot(ate) : `dura até ${ymRot(ate)} (uns ${Math.floor(n/12)} ano${n>=24?'s':''}${n%12?' e '+(n%12)+' meses':''})`;
}

          <b style="font-weight:600;font-size:16px">${esc(o.nome)}</b><span class="num" style="font-size:17px">${falta>0?'faltam '+brl(falta,0):'tudo certo ✓'}</span></button>
        <div class="meter" style="margin:8px 0 8px"><i style="width:${tot>0?((tot-falta)/tot*100).toFixed(1):0}%"></i></div>
        ${o.itens.map((i,k)=>`<div class="sw" style="padding:4px 0">
          <button class="chk${i.ok?' on':''}" style="width:24px;height:24px" data-act="obj-ok" data-id="${o.id}" data-v="${k}" aria-label="${i.ok?'Desmarcar':'Marcar'} ${esc(i.n)}">${CHECK.replace(/16/g,'13')}</button>
          <span style="flex:1;${i.ok?'color:var(--mut)':''}">${esc(i.n)} <span class="tiny mut">· ${i.ok?esc(i.nota||'pago'):i.mes?'paga em '+ymRot(i.mes):'sem data'}</span></span>
          <span class="num"${i.ok?' style="color:var(--mut)"':''}>${brl(i.v,0)}</span></div>`).join('')}
      </div>`;}).join('')}</div>`
    :'<div class="empty">Formatura, viagem, trocar de celular… coloque aqui, com o mês de pagar, e entra na previsão.</div>'}
  </div>`);

  out.push(cardDesejos());
  out.push(`<button class="btn blk" data-act="sim" style="min-height:52px">Posso gastar isso?</button>`);
  return out.join('');
}

/* lançar / editar gasto */
function novoAdd(){
  const f = S.ultForma==='mae' && !(plano(MES()).mae>0) ? 'cartao' : (S.ultForma||'cartao');
  return {id:null, amt:'', c:'comida', f, t:'', d:HOJE(), n:1};
}
const parcelando = A => !A.id && A.f==='cartao' && A.n > 1;
function previa(A){
  const v = nnum(A.amt), m = A.d.slice(0,7);
  if(parcelando(A)){
    const de = mesDaFatura(A.d);
    return `${A.n}x de ${brl(v/A.n)} · ${ymRot(de)} a ${ymRot(ymAdd(de,A.n-1))}. Entra no cartão como parcela, fora dos envelopes.`;
  }
  const env = A.f==='mae' ? 'mae' : CAT[A.c].env;
  const g = gastos(m), antigo = A.id ? S.lanc.find(l=>l.id===A.id) : null;
  const jaConta = antigo && envDe(antigo)===env && antigo.d.slice(0,7)===m ? +antigo.v : 0;
  const teto = env==='dia' ? +S.metas.dia||0 : env==='out' ? +S.metas.out||0 : plano(m).mae;
  const resta = teto - (g[env] - jaConta) - v;
  const nome = env==='mae' ? nomeMae() : ENV[env].n;
  if(!v) return `entra em ${nome}`;
  if(resta >= 0){
    if(env==='dia' && m===MES()){
      const DM = diasMes(m), dia = +HOJE().slice(8,10), dr = Math.max(DM-dia, 0);
      return `${nome}: restam ${brl(resta,0)}${dr?` · ${brl(resta/dr)}/dia daqui pra frente`:''}`;
    }
    return `${nome}: restam ${brl(resta,0)}`;
  }
  return `<span class="warn">passa ${brl(-resta,0)} do teto de ${nome}</span>`;
}
function shAdd(){
  const A = UI.add, v = nnum(A.amt);
  const mae = plano(A.d.slice(0,7)).mae > 0 || A.f==='mae';

}
const FORMAS = () => [['cartao','Cartão'],['pix','Pix/débito'],['mae',nomeMae()]];
function atualizaAmt(){
  const a = document.getElementById('amt'), p = document.getElementById('prev'), b = document.querySelector('[data-act="salvar-lanc"]');
  if(a) a.textContent = 'R$ ' + (UI.add.amt||'0');
  if(p) p.innerHTML = previa(UI.add);
  if(b) b.textContent = textoBotao(UI.add);
}
function textoBotao(A){
  const v = nnum(A.amt);
  if(parcelando(A)) return 'Lançar ' + A.n + 'x' + (v ? ' de ' + brl(v/A.n) : '');
  return (A.id ? 'Salvar' : 'Lançar') + (v ? ' ' + brl(v) : '');
}
function tecla(t){
  const A = UI.add;
  if(t==='⌫') A.amt = A.amt.slice(0,-1);
  else if(t===','){ if(!A.amt.includes(',')) A.amt = (A.amt||'0') + ','; }
  else { const dec = A.amt.split(',')[1]; if(!(dec && dec.length>=2) && A.amt.replace(',','').length<8) A.amt = (A.amt+t).replace(/^0(?=\d)/,''); }
  atualizaAmt();
}
function salvarLanc(){
  const A = UI.add, v = nnum(A.amt);
  const desc = document.getElementById('i-desc'); if(desc) A.t = desc.value.trim();
  if(!v){ toast('Digite o valor'); return; }
  snap();
  if(parcelando(A)){
    const nome = A.t || CAT[A.c].n, pv = Math.round(v/A.n*100)/100;
    S.itens.push({id:uid(), tipo:'cartao', nome, v:pv, n:A.n, de:mesDaFatura(A.d)});
    S.ultForma = A.f; save(); fechar(); render(); toast(nome+': '+A.n+'x de '+brl(pv)+' no cartão', true);
    return;
  }
  if(A.id){
    const l = S.lanc.find(x=>x.id===A.id);
    if(l) Object.assign(l, {v, c:A.c, f:A.f, t:A.t, d:A.d});
    S.ultForma = A.f; save(); fechar(); render(); toast('Gasto atualizado', true);
  } else {
    S.lanc.push({id:uid(), d:A.d, v, c:A.c, f:A.f, t:A.t});
    S.ultForma = A.f; save(); fechar(); render(); toast(brl(v)+' em '+CAT[A.c].n, true);
    if(UI.depois){ const f = UI.depois; UI.depois = null; f(); }
  }
}

function lerItemForm(){
  const E = UI.ed, g = id => document.getElementById(id);
  if(g('e-nome')) E.nome = g('e-nome').value.trim();
  if(g('e-v')) E.v = nnum(g('e-v').value);
  if(g('e-dia')) E.dia = Math.min(Math.max(parseInt(g('e-dia').value,10)||0,0),31) || '';
  if(g('e-k')) E.k = Math.max(parseInt(g('e-k').value,10)||1,1);
  if(g('e-n')) E.n = Math.max(parseInt(g('e-n').value,10)||1,1);
  if(g('e-ate')) E.ate = g('e-ate').value || E.ate;
  if(g('e-auto')) E.auto = g('e-auto').checked;
}
function salvarItem(){
  lerItemForm();
  const E = UI.ed, m = E.m;
  if(E.tipo!=='mae' && !E.nome){ toast('Dê um nome'); return; }
  if(E.rep==='parc' && E.k > E.n){ toast('A parcela não pode passar do total'); return; }
  snap();
  let it = E.id ? S.itens.find(i=>i.id===E.id) : null;
  if(!it){ it = {id:uid(), tipo:E.tipo, nome:E.nome, v:E.v, de:m}; S.itens.push(it); }
  else {
    if(E.tipo!=='mae') it.nome = E.nome;
    if(!ativo(it,m) || E.v !== valor(it,m)){
      if(E.escopo==='so'){ it.so = Object.assign({}, it.so, {[m]:E.v}); }
      else {
        it.hist = (it.hist||[]).filter(h=>h.de < m);
        if(it.so) delete it.so[m];
        if(it.de && m <= it.de){ it.v = E.v; it.hist = []; } else it.hist.push({de:m, v:E.v});
        if(!it.hist.length) delete it.hist;
      }
    }
  }
  if(it.tipo!=='mae'){
    if(E.tipo==='entrada'||E.tipo==='conta'){ if(E.dia) it.dia = E.dia; else delete it.dia; }
    if(E.tipo==='conta' && E.auto) it.auto = true; else delete it.auto;
    delete it.n; delete it.ate;
    if(E.rep==='parc'){ it.n = E.n; it.de = ymAdd(m, -(E.k-1)); }
    else if(E.rep==='unico'){ it.de = m; it.ate = m; }
    else if(E.rep==='ate'){ it.ate = E.ate < (it.de||m) ? (it.de||m) : E.ate; }
  }
  save(); fechar(); render(); toast('Salvo', true);
}
function delItem(modo){
  const E = UI.ed, m = E.m, it = S.itens.find(i=>i.id===E.id); if(!it) return;
  snap();
  if(modo==='so') it.so = Object.assign({}, it.so, {[m]:null});
  else if(modo==='tudo' || !it.de || m <= it.de) S.itens = S.itens.filter(i=>i.id!==it.id);
  else if(it.n){ const k = parcK(it,m); if(k<=1) S.itens = S.itens.filter(i=>i.id!==it.id); else it.n = k-1; }
  else it.ate = ymAdd(m,-1);
  save(); fechar(); render(); toast('Tirado do plano', true);
}

/* posso gastar isso? */
function simOut(){
  const v = UI.sim, M = MES(), g = gastos(M);
  const livreOut = Math.max((+S.metas.out||0) - g.out, 0);
  const doOut = Math.min(livreOut, v), daRes = v - doOut;
  const depois = reservaInicio() - daRes;
  let rr = depois, ate = null;
  for(let i=0;i<360;i++){ rr += plano(ymAdd(M,i)).aporte; if(rr<0){ ate = ymAdd(M,i); break; } }
  const ate0 = duraAte();
  const perde = ate0 && ate ? ymDiff(ate0, ate) : 0;
  let ver;
  if(!v) ver = 'Digite um valor.';
  else if(daRes===0) ver = 'Cabe nos outros gastos deste mês. Pode ir.';
  else if(!ate) ver = 'Dá: sai da reserva, mas ela continua de pé no plano.';
  else if(perde<=0) ver = 'Sai da reserva, mas quase não muda até quando ela dura.';
  else ver = `Sai da reserva e ela passa a acabar ${perde} ${perde===1?'mês':'meses'} antes (${ymRot(ate)} em vez de ${ymRot(ate0)}).`;
  return `<div class="card flush"><div class="rows">
    <div class="r"><span class="tx"><b>Sai de</b></span><span class="v" style="font-size:15px">${daRes===0?'Outros gastos':doOut>0?`Outros ${brl(doOut,0)} + reserva ${brl(daRes,0)}`:'Reserva'}</span></div>
    <div class="r"><span class="tx"><b>Reserva depois</b></span><span class="v">${brl(depois,0)}</span></div>
    <div class="r"><span class="tx"><b>No plano, a reserva</b></span><span class="v" style="font-size:15px">${ate?'acaba em '+ymRot(ate):'não acaba'}</span></div>
  </div></div>
  <div class="nota" style="margin-top:12px">${ver}</div>`;
}

  <div class="small mut2" style="margin-bottom:10px">Primeiro sai do que resta de outros gastos do mês; o resto sai da reserva.</div>

/* ══════════════════ extratos do banco ══════════════════
   O arquivo é lido aqui mesmo (extrato.js); nada sai do aparelho.
   Cada transação vira: gasto (envelopes), conta do plano paga, fatura paga,
   parcelamento novo no cartão, entrada, ou fica de fora (já no plano,
   transferência entre contas, reserva, já lançada à mão). */
const normTxt = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const palavras = s => new Set(normTxt(s).split(' ').filter(w=>w.length>=3 && !/^\d+$/.test(w)));
function parecido(a, b){ const A = palavras(a), B = palavras(b); let n = 0; A.forEach(w=>{ if(B.has(w)) n++; }); return n; }
const perto = (a, b) => Math.abs(a-b) <= Math.max(1, Math.abs(b)*0.03);
const diasEntre = (a, b) => Math.round((dataD(a) - dataD(b))/864e5);
const semParcela = s => String(s).replace(/\s*[-–]?\s*(parcela|parc\.?)?\s*\d{1,2}\s*(\/|de)\s*\d{1,2}\s*$/i,'').trim() || s;
const GRUPOS = [
  ['gasto','Gastos','entram nos envelopes de vida diária e outros'],
  ['parcela','Parcelamentos novos','viram parcelas do cartão (fora dos envelopes)'],
  ['conta','Contas do plano','ficam marcadas como pagas'],
  ['fatura','Pagamento da fatura','a fatura fica marcada como paga'],
  ['entrada','Entradas','dinheiro que entrou'],
  ['plano','Já estão no plano','assinaturas e parcelas que você já tem: não contam de novo'],
  ['ignorar','Não é gasto','transferências entre suas contas, reserva, pagamento de fatura'],
  ['dup','Já lançados à mão','não entram de novo']
];
const FONTES = [['corrente','Conta'],['cartao','Meu cartão'],['mae','Cartão da mãe']];

function abrirExtrato(){ UI.ext = {arqs:[], linhas:null, avisos:[], aberta:null, grupos:{}, regras:{}}; abrir('ext'); }
const CDN_PDF = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function carregarScript(src){
  return new Promise((ok, erro)=>{ const el = document.createElement('script'); el.src = src; el.onload = ok;
    el.onerror = () => erro(new Error('precisa de internet para ler PDF')); document.head.appendChild(el); });
}
async function textoDoPDF(bytes){
  if(!window.pdfjsLib) await carregarScript(CDN_PDF + 'pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc = CDN_PDF + 'pdf.worker.min.js';
  let doc;
  try{ doc = await pdfjsLib.getDocument({data:bytes}).promise; }
  catch(e){ throw new Error(e && e.name==='PasswordException' ? 'PDF com senha: exporte em OFX ou CSV' : 'não deu pra abrir o PDF'); }
  const linhas = [];
  for(let p = 1; p <= doc.numPages; p++){
    const tc = await (await doc.getPage(p)).getTextContent(), filas = [];
    tc.items.forEach(it=>{
      if(!it.str || !it.str.trim()) return;
      const y = it.transform[5]; let f = filas.find(f=>Math.abs(f.y-y) < 3);
      if(!f){ f = {y, its:[]}; filas.push(f); }
      f.its.push({x:it.transform[4], s:it.str});
    });
    filas.sort((a,b)=>b.y-a.y).forEach(f=>linhas.push(f.its.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim()));
  }
  return linhas.join('\n');
}
async function lerArquivosExtrato(files){
  const X = UI.ext; if(!X) return;
  X.carregando = true; renderSheet();
  const ano = +HOJE().slice(0,4);
  for(const f of files){
    try{
      const bytes = new Uint8Array(await f.arrayBuffer());
      const pdf = /\.pdf$/i.test(f.name) || (bytes[0]===0x25 && bytes[1]===0x50 && bytes[2]===0x44 && bytes[3]===0x46);
      const r = pdf ? Extrato.lerTexto(await textoDoPDF(bytes), {ano}) : Extrato.ler(Extrato.decodificar(bytes), f.name, {ano});
      X.arqs.push({nome:f.name, banco:r.banco, conta:r.conta, fonte:r.conta, trans:r.transacoes||[], avisos:r.avisos||[]});
      if(!(r.transacoes||[]).length) X.avisos.push(f.name + ': não achei transações' + ((r.avisos||[]).length ? ' (' + r.avisos.join('; ') + ')' : '') + '.');
    }catch(e){ X.avisos.push(f.name + ': ' + ((e && e.message) || 'não deu pra ler')); }
  }
  X.carregando = false;
  if(X.arqs.some(a=>a.trans.length)) montarRevisao();
  renderSheet();
}
function lerTextoExtrato(texto){
  const X = UI.ext, r = Extrato.lerTexto(texto, {ano:+HOJE().slice(0,4)});
  if(!(r.transacoes||[]).length){ X.avisos.push('Não achei transações no texto colado. Cada linha precisa ter data, descrição e valor.'); renderSheet(); return; }
  X.arqs.push({nome:'texto colado', banco:r.banco, conta:r.conta, fonte:r.conta, trans:r.transacoes, avisos:r.avisos||[]});
  montarRevisao(); renderSheet();
}
const fonteDe = l => UI.ext.arqs[l.ai].fonte || 'corrente';
function montarRevisao(){
  const X = UI.ext, vistos = new Set(Object.keys(S.vistos)), nesta = new Set(), L = [];
  S.lanc.forEach(l=>{ if(l.ext) vistos.add(l.ext); }); S.entr.forEach(e=>{ if(e.ext) vistos.add(e.ext); });
  X.repetidos = 0;
  X.arqs.forEach((a, ai)=>a.trans.forEach(t=>{
    if(nesta.has(t.id)) return; nesta.add(t.id);
    if(vistos.has(t.id)){ X.repetidos++; return; }
    L.push(classificarLinha({t, ai}));
  }));
  X.linhas = L.sort((a,b)=>a.t.data<b.t.data?1:a.t.data>b.t.data?-1:0);
  // o extrato substitui o “Gastos antes do app” lançado no primeiro uso
  const meses = new Set(L.filter(l=>l.acao==='gasto').map(l=>l.t.data.slice(0,7)));
  X.antes = S.lanc.filter(l=>l.t==='Gastos antes do app' && meses.has(l.d.slice(0,7))).map(l=>l.id);
  X.meses = meses;
  if(X.apagarAntes == null) X.apagarAntes = true;
}
function classificarLinha(l){
  const t = l.t, fonte = fonteDe(l), m = t.data.slice(0,7), v = Math.abs(t.valor);
  const c = Extrato.classificar(t, Object.assign({}, S.regras, UI.ext.regras));
  Object.assign(l, {c, chave:c.chave, cat:c.cat, motivo:'', item:null, acao:null});
  if(c.tipo==='fatura'){ l.acao = fonte==='corrente' ? 'fatura' : 'ignorar'; l.motivo = fonte==='corrente' ? 'marca a fatura como paga' : 'pagamento da fatura'; return l; }
  if(c.tipo==='transferencia'){ l.acao = 'ignorar'; l.motivo = 'entre as suas contas'; return l; }
  if(c.tipo==='investimento'){ l.acao = 'ignorar'; l.motivo = t.valor > 0 ? 'saiu da reserva/investimento' : 'foi para a reserva/investimento'; l.inv = true; return l; }
  if(c.tipo==='entrada'){ l.acao = 'entrada'; return l; }
  if(t.valor < 0 && c.confianca!=='regra'){
    if(fonte==='corrente'){
      const pg = S.pagos[m]||{};
      const cc = plano(m).contas.filter(x=>!pg[x.it.id] && perto(v, x.v) && (v >= 50 || parecido(t.desc, x.it.nome) > 0))
        .sort((a,b)=>parecido(t.desc,b.it.nome) - parecido(t.desc,a.it.nome));
      if(cc.length){ l.acao = 'conta'; l.item = cc[0].it.id; l.motivo = 'marca “' + rotulo(cc[0].it, m) + '” como paga'; return l; }
    }
    if(fonte==='cartao'){
      const hit = [m, mesDaFatura(t.data)].flatMap(mm=>plano(mm).cart).find(x=>perto(v, x.v) &&
        (parecido(t.desc, x.it.nome) > 0 || c.assinatura || (t.parcela && x.it.n===t.parcela.n)));
      if(hit){ l.acao = 'plano'; l.motivo = 'já no plano: ' + hit.it.nome; return l; }
      if(t.parcela && t.parcela.n > 1){ l.acao = 'parcela'; l.motivo = 'vira parcelamento ' + t.parcela.k + '/' + t.parcela.n + ' no cartão'; return l; }
    }
  }
  const dup = S.lanc.find(x=>!x.ext && Math.abs(x.v - (-t.valor)) < 0.01 && Math.abs(diasEntre(x.d, t.data)) <= 2);
  if(dup){ l.acao = 'dup'; l.motivo = 'já lançado à mão em ' + ddmm(dup.d); return l; }
  l.acao = 'gasto'; if(!CAT[l.cat]) l.cat = 'outros';
  return l;
}
function escolherExt(l, v){
  if(v==='entrada'){ l.acao = 'entrada'; l.motivo = ''; }
  else if(v==='ignorar'){ l.acao = 'ignorar'; l.motivo = 'marcado por você'; }
  else { l.acao = 'gasto'; l.cat = v; l.motivo = ''; }
  l.mexi = true;
}
function linhaExt(l, i){
  const t = l.t, cat = CAT[l.cat]||CAT.outros, aberta = UI.ext.aberta===i;
  const confira = l.acao==='gasto' && l.c.confianca==='palpite' && !l.mexi;
  const sub = l.acao==='gasto' ? cat.n + (l.c.assinatura ? ' · assinatura' : '') + (t.valor > 0 ? ' · estorno' : '') : (l.motivo || (l.acao==='entrada' ? 'entrada' : ''));

      <span class="v${t.valor>0?' ok':''}">${t.valor>0?'+':''}${brl(Math.abs(t.valor))}</span></button>

      <button class="chip${l.acao==='entrada'?' on':''}" data-act="ext-cat" data-v="entrada" data-i="${i}">Entrada</button>
      <button class="chip${l.acao==='ignorar'?' on':''}" data-act="ext-cat" data-v="ignorar" data-i="${i}">Não é gasto</button></div>
      <div class="tiny mut" style="padding:0 16px 12px">Vale para tudo de “${esc(l.chave||t.desc)}”, agora e nos próximos extratos.</div>`:''}
  </div>`;
